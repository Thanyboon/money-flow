r-radius:5px 5px 2px 2px;background:var(--red);min-height:3px}.labels{display:flex;justify-content:space-around;color:var(--muted);font-size:10px}.empty{text-align:center;color:var(--muted);padding:28px 8px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;justify-content:center;z-index:10;padding:12px}.modal.show{display:flex}.bill-preview{display:block;width:100%;height:auto;max-height:65dvh;object-fit:contain;background:#f4f6fb;border-radius:12px;border:1px solid var(--line);touch-action:pan-y}.preview-hint{font-size:13px;color:var(--muted);text-align:center;margin:8px 0 14px}.sheet{background:var(--panel);color:var(--text);width:min(620px,100%);max-height:90dvh;overflow:auto;border-radius:22px;padding:20px}.sheethead{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#102337;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;display:none;max-width:90%;font-size:13px}.toast.show{display:block}.login{max-width:420px;margin:12vh auto;padding:22px}.sync{font-size:11px;color:var(--muted)}.bill-card{border-radius:18px;padding:16px;background:var(--panel);border:1px solid var(--line)}@media(min-width:760px){.app{display:flex}.sidebar{display:flex;flex-direction:column;width:230px;flex:0 0 230px;box-sizing:border-box;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;gap:7px;position:sticky;top:0;height:100dvh;overflow-y:auto;overscroll-behavior:contain;align-self:flex-start}.sidebar button{text-align:left;padding:12px;border:0;border-radius:11px;background:transparent;color:var(--text)}.sidebar button.active{background:var(--mint2);color:var(--mint);font-weight:800}.main{flex:1;padding:28px 30px 50px}.nav{display:none}.grid.metrics{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.formgrid{grid-template-columns:1fr 1fr}}@media(min-width:1000px){.main{padding:34px 42px 60px}.contentgrid{display:grid;grid-templa <script>
const $=s=>document.querySelector(s);const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});const state={api:localStorage.getItem('mf_api')||'',data:{},page:'home',theme:localStorage.getItem('mf_theme')||'light',accent:localStorage.getItem('mf_accent')||'mint',txSort:localStorage.getItem('mf_tx_sort')||'newest',calendarMonth:localStorage.getItem('mf_calendar_month')||new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}).slice(0,7),calendarDate:today(),budgetMonth:localStorage.getItem('mf_budget_month')||new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}).slice(0,7)};let homeSelectedMonth=localStorage.getItem('mf_home_month')||new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}).slice(0,7);
const tables=['Transactions','Wallets','Categories','Budgets','SavingsGoals','SavingsHistory','BankReconciliation','BillGroups','BillMembers','Bills','BillItems','BillPayments','Settings'];
const fmt=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0);const id=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function postApi(params){
  return new Promise((resolve,reject)=>{
    if(!state.api) return reject(Error('กรุณาตั้งค่า Google Apps Script URL'));
    const nonce=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/[^a-zA-Z0-9]/g,'');
    const frame=document.createElement('iframe'),form=document.createElement('form');
    const frameName='mf_frame_'+nonce;
    frame.name=frameName;frame.style.display='none';frame.setAttribute('aria-hidden','true');
    form.method='POST';form.action=state.api;form.target=frameName;form.style.display='none';
    Object.entries({...params,nonce}).forEach(([k,v])=>{
      const input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v??'');form.appendChild(input);
    });
    let finished=false;
    const cleanup=()=>{window.removeEventListener('message',onMessage);clearTimeout(timer);form.remove();frame.remove()};
    const finish=(fn,value)=>{if(finished)return;finished=true;cleanup();fn(value)};
    const onMessage=(event)=>{
      // Apps Script HtmlService may wrap the response in an additional sandbox iframe.
      // The one-time random nonce binds the reply to this request.
      const data=event.data;
      if(!data||data.mf!==true||data.nonce!==nonce)return;
      finish(resolve,data.payload);
    };
    window.addEventListener('message',onMessage);
    const timer=setTimeout(()=>finish(reject,Error('หมดเวลาการเชื่อมต่อ กรุณาตรวจสอบ URL และอินเทอร์เน็ต')),25000);
    document.body.append(frame,form);
    form.submit();
  });
}
async function api(action,extra={}){return postApi({action,...extra})}
const QUEUE_KEY='mf_pending_mutations';
function pendingOps(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch(e){return []}}
function saveCache(){localStorage.setItem('mf_cache',JSON.stringify(state.data))}
function queueMutation(op){const q=pendingOps();q.push({...op,qid:id()});localStorage.setItem(QUEUE_KEY,JSON.stringify(q));}
let flushing=false;
async function flushQueue(){
  if(flushing||!state.api||!navigator.onLine)return;
  flushing=true;
  try{
    while(true){
      const q=pendingOps();if(!q.length)break;
      const op=q[0];
      const r=await api('mutate',op.kind==='delete'?{table:op.table,op:'delete',id:op.id}:{table:op.table,op:'upsert',row:JSON.stringify(op.row)});
      if(!r.ok)throw Error(r.error||'ซิงค์ข้อมูลไม่สำเร็จ');
      if(op.kind==='upsert'&&r.row){
        const list=state.data[op.table]||(state.data[op.table]=[]),at=list.findIndex(x=>String(x.id)===String(r.row.id));
        if(at>=0)list[at]=r.row;else list.push(r.row);
      }
      const latest=pendingOps().filter(x=>x.qid!==op.qid);localStorage.setItem(QUEUE_KEY,JSON.stringify(latest));saveCache();
    }
    state.lastSync=new Date();renderPage();
  }catch(err){console.warn('MONEY FLOW sync pending:',err.message);toast('บันทึกในเครื่องแล้ว รอซิงค์: '+err.message)}
  finally{flushing=false}
}
async function loadData(){
  let r=await api('bootstrap');if(!r.ok)throw Error(r.error);
  const remote=r.data||{},q=pendingOps();
  state.data=remote;tables.forEach(t=>state.data[t] ||= []);
  q.forEach(op=>{
    const list=state.data[op.table]||(state.data[op.table]=[]);
    if(op.kind==='delete')state.data[op.table]=list.filter(x=>String(x.id)!==String(op.id));
    else {const at=list.findIndex(x=>String(x.id)===String(op.row.id));if(at>=0)list[at]=op.row;else list.push(op.row);}
  });
  saveCache();state.lastSync=new Date();
  if(q.length)flushQueue();checkBillReminderAlerts();
}
async function save(table,row,opts={}){
  row={...row,id:row.id||id()};
  const list=state.data[table]||(state.data[table]=[]),index=list.findIndex(x=>String(x.id)===String(row.id));
  if(index>=0)list[index]=row;else list.push(row);
  saveCache();queueMutation({kind:'upsert',table,row});
  if(!opts.silent){renderPage();toast('บันทึกแล้ว · กำลังซิงค์')}
  flushQueue();
  return row;
}
async function del(table,recordId){
  const item=rows(table).find(x=>String(x.id)===String(recordId));if(!item)return;
  if(table==='Wallets'&&rows('Transactions').some(x=>x.walletId===recordId))return toast('กระเป๋านี้มีธุรกรรมอยู่ กรุณาลบหรือย้ายธุรกรรมก่อน เพื่อป้องกันข้อมูลการเงินสูญหาย');
  const label=({Transactions:'ธุรกรรม',Wallets:'กระเป๋าเงิน',SavingsGoals:'เป้าหมายการออม',Budgets:'งบประมาณ',Bills:'บิล',BillGroups:'กลุ่มหารบิล',BillMembers:'สมาชิก',BankReconciliation:'ประวัติตรวจสอบบัญชี',SavingsHistory:'ประวัติการออม'})[table]||'รายการ';
  if(!confirm(`ยืนยันลบ${label}นี้? การลบไม่สามารถย้อนกลับได้`))return;
  const related=[];
  if(table==='Bills')related.push(...rows('BillItems').filter(x=>x.billId===recordId).map(x=>['BillItems',x.id]),...rows('BillPayments').filter(x=>x.billId===recordId).map(x=>['BillPayments',x.id]));
  if(table==='BillGroups'){const bids=rows('Bills').filter(x=>x.groupId===recordId).map(x=>x.id);related.push(...rows('BillMembers').filter(x=>x.groupId===recordId).map(x=>['BillMembers',x.id]));for(const bid of bids)related.push(['Bills',bid],...rows('BillItems').filter(x=>x.billId===bid).map(x=>['BillItems',x.id]),...rows('BillPayments').filter(x=>x.billId===bid).map(x=>['BillPayments',x.id]));}
  if(table==='SavingsGoals')related.push(...rows('SavingsHistory').filter(x=>x.goalId===recordId).map(x=>['SavingsHistory',x.id]));
  const targets=[...related,[table,recordId]];
  targets.forEach(([t,rid])=>{state.data[t]=rows(t).filter(x=>String(x.id)!==String(rid));queueMutation({kind:'delete',table:t,id:rid});});
  saveCache();renderPage();toast('ลบแล้ว · กำลังซิงค์');flushQueue();
}
function sortTransactions(list,mode=state.txSort||'newest'){
  return list.map((x,i)=>({x,i})).sort((a,b)=>{
    const ad=String(a.x.date||'').slice(0,10),bd=String(b.x.date||'').slice(0,10);
    const cmp=ad.localeCompare(bd);
    if(cmp)return mode==='oldest'?cmp:-cmp;
    const ac=String(a.x.createdAt||a.x.timestamp||''),bc=String(b.x.createdAt||b.x.timestamp||'');
    if(ac&&bc&&ac!==bc)return mode==='oldest'?ac.localeCompare(bc):bc.localeCompare(ac);
    return mode==='oldest'?a.i-b.i:b.i-a.i;
  }).map(v=>v.x);
}
function rows(t){return state.data[t]||[]}function txWalletImpact(x){const a=Number(x.amount)||0;return x.type==='income'||x.type==='transfer_in'?a:-a}function walletName(id){return rows('Wallets').find(x=>x.id===id)?.name||'ไม่ระบุบัญชี'}function catName(id){return rows('Categories').find(x=>x.id===id)?.name||'อื่น ๆ'}function monthNow(){return today().slice(0,7)}function txTotals(m=monthNow()){let tx=rows('Transactions').filter(x=>String(x.date).slice(0,7)===m),inc=tx.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),exp=tx.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0);let bal=rows('Wallets').filter(w=>w.active!==false&&w.active!=='false').reduce((a,w)=>a+Number(w.openingBalance||0),0)+rows('Transactions').reduce((a,x)=>a+txWalletImpact(x),0);return{inc,exp,bal,tx}}
function renderShell(){document.body.classList.toggle('dark',state.theme==='dark');applyAccent();$('#app').innerHTML=`<aside class="sidebar"><div class="brand" style="margin:4px 8px 22px"><div class="logo">↗</div>MONEY FLOW</div>${navItems().map(n=>`<button class="${state.page===n.id?'active':''}" style="${n.id==='settings'?'margin-top:auto;border-top:1px solid var(--line);padding-top:16px;':''}" onclick="go('${n.id}')">${n.icon}　${n.label}</button>`).join('')}<div style="margin-top:auto" class="sync">ซิงค์ล่าสุด: ${state.lastSync?.toLocaleTimeString('th-TH')||'-'}</div></aside><main class="main"><header class="top"><div><div class="brand"><div class="logo">↗</div><span>MONEY FLOW</span></div><div class="sync">${state.lastSync?'ซิงค์ล่าสุด '+state.lastSync.toLocaleTimeString('th-TH'):'พร้อมใช้งาน'}</div></div><div class="actions"><button class="btn ghost" onclick="toggleTheme()">${state.theme==='dark'?'☀️':'🌙'}</button><button class="btn ghost" onclick="refresh()">↻</button></div></header><div id="page"></div></main><nav class="nav" aria-label="เมนูหลัก">${navItems().map(n=>`<button class="${state.page===n.id?'active':''}" onclick="go('${n.id}')"><span>${n.icon}</span>${n.short||n.label}</button>`).join('')}</nav>`;renderPage()}
function navItems(){return[{id:'home',label:'ภาพรวม',short:'หน้าหลัก',icon:'⌂'},{id:'transactions',label:'ธุรกรรม',short:'รายการ',icon:'↔'},{id:'calendar',label:'ปฏิทินการเงิน',short:'ปฏิทิน',icon:'🗓️'},{id:'insights',label:'วิเคราะห์การเงิน',short:'วิเคราะห์',icon:'📊'},{id:'wallets',label:'กระเป๋าเงิน',icon:'▣'},{id:'savings',label:'เป้าหมายออม',short:'ออมเงิน',icon:'◎'},{id:'budgets',label:'งบประมาณ',icon:'▤'},{id:'missions',label:'ภารกิจเก็บเงิน',short:'ภารกิจ',icon:'🎀'},{id:'bills',label:'หารบิลกับเพื่อน',icon:'♧'},{id:'reconcile',label:'ตรวจสอบบัญชี',icon:'✓'},{id:'reports',label:'รายงาน',icon:'▥'},{id:'settings',label:'ตั้งค่า',icon:'⚙'}]}
function go(p){state.page=p;renderShell()}
const accents={mint:{name:'เขียวมิ้นต์',main:'#10b981',soft:'#d1fae5'},purple:{name:'ม่วงลาเวนเดอร์',main:'#8b5cf6',soft:'#ede9fe'},pink:{name:'ชมพูพาสเทล',main:'#ec4899',soft:'#fce7f3'},blue:{name:'ฟ้าใส',main:'#3b82f6',soft:'#dbeafe'},orange:{name:'ส้มพีช',main:'#f97316',soft:'#ffedd5'}};
function applyAccent(){const a=accents[state.accent]||accents.mint;document.documentElement.style.setProperty('--mint',a.main);document.documentElement.style.setProperty('--mint2',a.soft);document.querySelector('meta[name="theme-color"]')?.setAttribute('content',state.theme==='dark'?'#101827':a.main)}

function settingValue(key,fallback=[]){
  const row=rows('Settings').find(x=>x.key===key);
  if(!row||!row.value)return fallback;
  try{return JSON.parse(row.value)}catch(e){return fallback}
}
async function saveSettingValue(key,value){
  const old=rows('Settings').find(x=>x.key===key);
  return save('Settings',{id:old?.id||'mf_'+key,key,value:JSON.stringify(value),updatedAt:new Date().toISOString()});
}

function insightsPage(){
  const m=homeSelectedMonth||monthNow(),[yy,mm]=m.split('-').map(Number),prevDate=new Date(yy,mm-2,1),prev=prevDate.getFullYear()+'-'+String(prevDate.getMonth()+1).padStart(2,'0');
  const current=rows('Transactions').filter(x=>String(x.date||'').slice(0,7)===m),prior=rows('Transactions').filter(x=>String(x.date||'').slice(0,7)===prev);
  const sum=(a,t)=>a.filter(x=>x.type===t).reduce((v,x)=>v+Number(x.amount||0),0),income=sum(current,'income'),expense=sum(current,'expense'),prevExpense=sum(prior,'expense'),rate=income>0?Math.max(0,(income-expense)/income*100):0;

async function submitMission(e,mid){e.preventDefault();const list=missionsList(),x={id:mid||id(),title:$('#miTitle').value.trim(),target:+$('#miTarget').value,progress:+$('#miProgress').value,deadline:$('#miDeadline').value};const i=list.findIndex(v=>v.id===x.id);if(i>=0)list[i]=x;else list.push(x);try{await saveSettingValue('mf_missions',list);closeModal();renderPage();toast('บันทึกภารกิจแล้ว')}catch(err){toast(err.message)}}

async function submitBillReminder(e,rid){e.preventDefault();const list=billReminders(),x={id:rid||id(),title:$('#brTitle').value.trim(),amount:+$('#brAmount').value,due:$('#brDue').value,note:$('#brNote').value,status:(list.find(v=>v.id===rid)||{}).status||'pending'};const i=list.findIndex(v=>v.id===x.id);if(i>=0)list[i]=x;else list.push(x);try{await saveSettingValue('mf_bill_reminders',list);closeModal();renderPage();toast('บันทึกวันจ่ายบิลแล้ว')}catch(err){toast(err.message)}}
async function markReminderPaid(rid){const list=billReminders(),x=list.find(v=>v.id===rid);if(!x)return;x.status='paid';x.paidAt=today();await saveSettingValue('mf_bill_reminders',list);renderPage();toast('ทำเครื่องหมายว่าจ่ายแล้ว')}
async function deleteBillReminder(rid){if(!confirm('ลบบิลเตือนนี้ใช่ไหม?'))return;await saveSettingValue('mf_bill_reminders',billReminders().filter(x=>x.id!==rid));renderPage()}
function checkBillReminderAlerts(){
  const due=billReminders().filter(x=>x.status!=='paid'&&x.due<=today());
  const stamp=today()+'|'+due.map(x=>x.id).join(',');
  if(due.length&&localStorage.getItem('mf_bill_alert_stamp')!==stamp){localStorage.setItem('mf_bill_alert_stamp',stamp);setTimeout(()=>toast('🔔 มีบิลที่ถึงกำหนดหรือเลยกำหนด '+due.length+' รายการ'),900)}
}

function transactionsPage(){let list=rows('Transactions').filter(x=>x.type==='income'||x.type==='expense'||x.type==='transfer_in'||x.type==='transfer_out').slice();list=sortTransactions(list);return `<h1 class="title">รายรับ–รายจ่าย</h1><div class="actions"><button class="btn" onclick="txForm('expense')">＋ เพิ่มรายจ่าย</button><button class="btn secondary" onclick="txForm('income')">＋ เพิ่มรายรับ</button><button class="btn ghost" onclick="transferForm()">⇄ โอนระหว่างบัญชี</button><button class="btn ghost" onclick="categoryManager()">⚙️ จัดการหมวดหมู่</button></div><div class="small muted" style="margin:6px 0 12px">โอนออกแสดงเครื่องหมาย − และโอนเข้าแสดงเครื่องหมาย + โดยยอดโอนไม่ถูกรวมในรายรับหรือรายจ่าย</div><div class="toolbar"><input id="txSearch" placeholder="ค้นหาหมายเหตุหรือหมวดหมู่" oninput="filterTx()"><select id="txSort" onchange="changeTxSort(this.value)"><option value="newest" ${state.txSort==='newest'?'selected':''}>วันที่ล่าสุดก่อน</option><option value="oldest" ${state.txSort==='oldest'?'selected':''}>วันที่เก่าก่อน</option></select><select id="txType" onchange="filterTx()"><option value="">ทุกประเภท</option><option value="income">รายรับ</option><option value="expense">รายจ่าย</option><option value="transfer">โอนระหว่างบัญชี</option></select></div><div class="panel" style="margin-bottom:12px"><b>เลือกช่วงเวลาที่ต้องการดู</b><div class="formgrid"><div class="field"><label>เดือนและปี</label><input id="txMonth" type="month" value="${monthNow()}" onchange="clearTxDate();filterTx()"></div><div class="field"><label>หรือเลือกวันที่เจาะจง</label><input id="txDate" type="date" onchange="filterTx()"></div></div><div class="actions"><button class="btn ghost" onclick="clearTxFilters()">ดูทั้งหมด</button><span class="small muted" id="txRangeLabel">แสดงรายการของเดือนนี้</span></div></div><div class="grid" style="margin-bottom:12px"><div class="metric"><span class="muted small">รายรับในช่วงที่เลือก</span><strong class="positive" id="txIncomeTotal">฿0.00</strong></div><div class="metric"><span class="muted small">รายจ่ายในช่วงที่เลือก</span><strong class="negative" id="txExpenseTotal">฿0.00</strong></div><div class="metric"><span class="muted small">ยอดโอนระหว่างบัญชี</span><strong style="color:#3B82F6" id="txTransferTotal">฿0.00</strong><div class="small muted">นับยอดโอนออกครั้งเดียว ไม่รวมรายรับ/รายจ่าย</div></div></div><div class="panel" id="txResults">${txList(list)}</div>`}
function clearTxDate(){const d=$('#txDate');if(d)d.value=''}
function clearTxFilters(){if($('#txSearch'))$('#txSearch').value='';if($('#txType'))$('#txType').value='';if($('#txMonth'))$('#txMonth').value='';if($('#txDate'))$('#txDate').value='';filterTx()}
function changeTxSort(v){state.txSort=v==='oldest'?'oldest':'newest';localStorage.setItem('mf_tx_sort',state.txSort);filterTx()}
function filterTx(){const q=($('#txSearch')?.value||'').toLowerCase(),typ=$('#txType')?.value||'',m=$('#txMonth')?.value||'',day=$('#txDate')?.value||'';let a=rows('Transactions').filter(x=>(x.type==='income'||x.type==='expense'||x.type==='transfer_in'||x.type==='transfer_out')&&(!q||(String(x.note||'')+' '+catName(x.categoryId)+' '+walletName(x.walletId)+' '+walletName(x.transferPeerWalletId)).toLowerCase().includes(q))&&(!typ||(typ==='transfer'?(x.type==='transfer_in'||x.type==='transfer_out'):x.type===typ))&&(day?String(x.date).slice(0,10)===day:(!m||String(x.date).slice(0,7)===m)));a=sortTransactions(a);const inc=a.filter(x=>x.type==='income').reduce((v,x)=>v+Number(x.amount||0),0),exp=a.filter(x=>x.type==='expense').reduce((v,x)=>v+Number(x.amount||0),0),tr=a.filter(x=>x.type==='transfer_out').reduce((v,x)=>v+Number(x.amount||0),0);if($('#txResults'))$('#txResults').innerHTML=txList(a);if($('#txIncomeTotal'))$('#txIncomeTotal').textContent=fmt(inc);if($('#txExpenseTotal'))$('#txExpenseTotal').textContent=fmt(exp);if($('#txTransferTotal'))$('#txTransferTotal').textContent=fmt(tr);if($('#txRangeLabel'))$('#txRangeLabel').textContent=day?'วันที่ '+day:m?'เดือน '+m:'ทุกช่วงเวลา'}
function walletsPage(){let w=rows('Wallets');return `<h1 class="title">กระเป๋าเงิน</h1><button class="btn" onclick="walletForm()">＋ เพิ่มกระเป๋าเงิน</button><div class="grid" style="margin-top:14px">${w.map(x=>{let bal=Number(x.openingBalance||0)+rows('Transactions').filter(t=>t.walletId===x.id).reduce((a,t)=>a+txWalletImpact(t),0);return `<div class="panel"><div class="bubble">▣</div><div class="section">${esc(x.name)} <div class="actions"><button class="btn ghost" onclick="walletForm('${x.id}')">แก้ไข</button><button class="btn danger" onclick="del('Wallets','${x.id}')">ลบ</button></div></div><div class="muted small">${esc(x.type||'บัญชี')}</div><strong style="font-size:23px">${fmt(bal)}</strong><div class="small muted">ยอดตั้งต้น ${fmt(x.openingBalance)}</div></div>`}).join('')}</div>${w.length?'':'<div class="empty">เพิ่มกระเป๋าเงินแรกของคุณ</div>'}`}
function savingsPage(){let a=rows('SavingsGoals');return `<h1 class="title">เป้าหมายการออม</h1><button class="btn" onclick="goalForm()">＋ สร้างเป้าหมาย</button><div class="grid" style="margin-top:14px">${a.map(x=>{let pct=Math.min(100,Number(x.currentAmount)/Math.max(1,Number(x.targetAmount))*100);return `<div class="panel"><div class="section">${esc(x.name)} <div class="actions"><button class="btn ghost" onclick="goalForm('${x.id}')">แก้</button><button class="btn danger" onclick="del('SavingsGoals','${x.id}')">ลบ</button></div></div><strong style="font-size:24px">${fmt(x.currentAmount)}</strong><div class="small muted">เป้าหมาย ${fmt(x.targetAmount)}</div><div class="bar" style="margin:12px 0"><i style="width:${pct}%"></i></div><div class="small">${pct.toFixed(1)}% · กำหนด ${esc(x.deadline||'-')}</div><button class="btn secondary" style="margin-top:12px" onclick="savingAction('${x.id}')">บันทึกการออม/ถอน</button></div>`}).join('')}</div>${a.length?'':'<div class="empty">ยังไม่มีเป้าหมายการออม</div>'}`}
function budgetMonthChanged(v){if(!v)return;state.budgetMonth=v;localStorage.setItem('mf_budget_month',v);renderPage()}
function budgetsPage(){let m=state.budgetMonth||monthNow(),a=rows('Budgets').filter(x=>x.month===m),total=a.reduce((s,x)=>s+Number(x.amount||0),0),spentAll=a.reduce((s,x)=>s+rows('Transactions').filter(t=>t.type==='expense'&&t.categoryId===x.categoryId&&String(t.date).startsWith(m)).reduce((v,t)=>v+Number(t.amount||0),0),0);return `<h1 class="title">🌷 งบประมาณ</h1><div class="toolbar"><input type="month" value="${esc(m)}" onchange="budgetMonthChanged(this.value)"><button class="btn" onclick="budgetForm()">＋ ตั้งงบประมาณ</button></div><div class="grid"><div class="metric"><span class="small muted">งบรวม</span><strong>${fmt(total)}</strong></div><div class="metric"><span class="small muted">ใช้ไปแล้ว</span><strong class="${spentAll>total?'negative':'positive'}">${fmt(spentAll)}</strong></div></div><div class="panel" style="margin-top:14px">${a.map(x=>{let spent=rows('Transactions').filter(t=>t.type==='expense'&&t.categoryId===x.categoryId&&String(t.date).startsWith(m)).reduce((s,t)=>s+Number(t.amount),0),pct=spent/Math.max(1,Number(x.amount))*100;return `<div style="margin:12px 0"><div class="item"><div class="grow"><b>${esc(catName(x.categoryId))}</b><div class="small muted">ใช้ ${fmt(spent)} จาก ${fmt(x.amount)}</div></div><div class="actions"><button class="btn ghost" onclick="budgetForm('${x.id}')">แก้</button><button class="btn danger" onclick="del('Budgets','${x.id}')">ลบ</button></div></div><div class="bar"><i style="width:${Math.min(100,pct)}%;background:${pct>=100?'var(--red)':pct>=80?'#f59e0b':'var(--mint)'}"></i></div><div class="small ${pct>=100?'negative':pct>=80?'':'muted'}">${pct.toFixed(0)}% ${pct>=100?'เกินงบแล้ว ⚠️':pct>=80?'ใกล้ถึงงบแล้ว 💛':'ของงบประมาณ 🌱'}</div></div>`}).join('')||'<div class="empty">ยังไม่ได้ตั้งงบประมาณเดือนนี้</div>'}</div>`}
function billsPage(){let groups=rows('BillGroups');return `<h1 class="title">บิลหารเงิน</h1>${billRemindersHtml()}<div class="actions"><button class="btn" onclick="billForm('')">＋ เพิ่มบิลทั่วไป</button><button class="btn secondary" onclick="groupForm()">＋ สร้างกลุ่มเพื่อน</button></div><div class="grid" style="margin-top:14px">${groups.map(g=>`<div class="panel"><div class="section">${esc(g.name)} <button class="btn" onclick="billForm('${g.id}')">＋ เพิ่มบิล</button></div><div class="small muted">${rows('BillMembers').filter(m=>m.groupId===g.id).length} สมาชิก · ${rows('Bills').filter(b=>b.groupId===g.id).length} บิล</div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="memberForm('${g.id}')">เพิ่มเพื่อน</button><button class="btn ghost" onclick="groupDetails('${g.id}')">สมาชิก</button><button class="btn danger" onclick="del('BillGroups','${g.id}')">ลบกลุ่ม</button></div></div>`).join('')}</div>${groups.length?'':'<div class="empty">สร้างบิลทั่วไปได้โดยไม่ต้องสร้างกลุ่มหรือใส่ชื่อเพื่อน</div>'}<div class="section">บิลที่บันทึกไว้</div><div class="panel">${rows('Bills').slice().reverse().map(b=>`<div class="item"><div class="grow"><b>${esc(b.title)}</b><div class="small muted">${esc(b.date)} · ${esc(rows('BillGroups').find(g=>g.id===b.groupId)?.name||'')}</div><div class="small muted">${(rows('BillItems').filter(i=>i.billId===b.id)).length} รายการ · ${Number(b.splitCount||0)} คน</div></div><b>${fmt(b.fullTotal||b.total)}</b><button class="btn ghost" onclick="billDetails('${b.id}')">เปิด</button><button class="btn danger" onclick="del('Bills','${b.id}')">ลบ</button></div>`).join('')||'<div class="empty">ยังไม่มีบิล</div>'}</div>`}
function reconcilePage(){return `<h1 class="title">ตรวจสอบยอดบัญชี</h1><p class="muted">เปรียบเทียบยอดตามระบบกับยอดเงินจริงที่คุณกรอกจากธนาคาร</p><button class="btn" onclick="reconcileForm()">＋ ตรวจสอบยอดใหม่</button><div class="panel" style="margin-top:14px">${rows('BankReconciliation').slice().reverse().map(x=>`<div class="item"><div class="grow"><b>${esc(walletName(x.walletId))}</b><div class="small muted">${esc(x.date)}</div><div class="small">ระบบ ${fmt(x.systemBalance)} · จริง ${fmt(x.actualBalance)} ${x.note?'· '+esc(x.note):''}</div></div><div style="display:grid;gap:6px;justify-items:end"><b class="${Math.abs(Number(x.difference))<0.005?'positive':'negative'}">${fmt(x.difference)}</b><div class="actions"><button class="btn ghost" onclick="reconcileForm('${x.id}')">แก้ไข</button><button class="btn danger" onclick="del('BankReconciliation','${x.id}')">ลบ</button></div></div></div>`).join('')||'<div class="empty">ยังไม่มีประวัติการตรวจสอบ</div>'}</div>`}
function reportsPage(){let t=txTotals(),cats={};rows('Transactions').filter(x=>x.type==='expense').forEach(x=>cats[x.categoryId]=(cats[x.categoryId]||0)+Number(x.amount));return `<h1 class="title">รายงานการเงิน</h1><div class="grid"><div class="metric"><span class="muted small">รายรับสะสม</span><strong class="positive">${fmt(rows('Transactions').filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0))}</strong></div><div class="metric"><span class="muted small">รายจ่ายสะสม</span><strong class="negative">${fmt(rows('Transactions').filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0))}</strong></div></div><div class="section">ค่าใช้จ่ายตามหมวดหมู่</div><div class="panel">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div class="grow">${esc(catName(k))}</div><b>${fmt(v)}</b></div>`).join('')||'<div class="empty">ไม่มีข้อมูล</div>'}</div><div class="section">ส่งออกข้อมูล</div><button class="btn secondary" onclick="exportCSV()">ดาวน์โหลดธุรกรรม CSV</button>`}
function settingsPage(){return `<h1 class="title">ตั้งค่า</h1><div class="panel"><div class="section">การเชื่อมต่อ</div><div class="small muted">Apps Script URL</div><div style="overflow-wrap:anywhere">${esc(state.api)}</div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="refresh()">ซิงค์ข้อมูล</button><button class="btn ghost" onclick="changeApi()">เปลี่ยน URL</button></div><div class="section">ธีม</div><button class="btn secondary" onclick="toggleTheme()">สลับ Light / Dark Mode</button><div class="section">สีภายในแอป</div><p class="small muted">เลือกสีที่ชอบ สีจะเปลี่ยนปุ่ม ไอคอน แถบเมนู และกราฟ โดยไม่กระทบข้อมูล</p><div class="actions" style="gap:10px;flex-wrap:wrap">${Object.entries(accents).map(([k,a])=>`<button class="btn ${state.accent===k?'':'ghost'}" style="background:${state.accent===k?a.main:'transparent'};color:${state.accent===k?'#fff':'var(--text)'};border:2px solid ${a.main}" onclick="setAccent('${k}')"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${a.main};vertical-align:middle;margin-right:5px"></span>${a.name}</button>`).join('')}</div><div class="section">ข้อมูลสำรอง</div><button class="btn secondary" onclick="backup()">ส่งออกข้อมูลทั้งหมด JSON</button><span class="small muted">โหมดไม่ใช้รหัสผ่าน</span></div><p class="small muted">MONEY FLOW ${'v1.5.3-settings-visible'} · ข้อมูลหลักเก็บใน Google Sheets</p>`}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}
function categoryManager(type='expense'){
  const cats=rows('Categories').filter(c=>c.type===type);
  openModal('จัดการหมวดหมู่รายรับ / รายจ่าย',`<div class="field"><label>เลือกประเภทหมวดหมู่</label><select id="catType" onchange="categoryManagerRender()"><option value="expense" ${type==='expense'?'selected':''}>รายจ่าย</option><option value="income" ${type==='income'?'selected':''}>รายรับ</option></select></div><div id="categoryManagerList">${categoryManagerListHtml(cats)}</div><form onsubmit="addCategory(event)" class="panel" style="margin-top:14px"><div class="field"><label>ชื่อหมวดหมู่ใหม่</label><input id="catNewName" maxlength="40" required placeholder="เช่น ค่าเดินทาง / เงินเดือน"></div><button class="btn" style="width:100%">＋ เพิ่มหมวดหมู่</button></form><p class="small muted">หมวดหมู่ที่มีรายการธุรกรรมหรืองบประมาณใช้อยู่ จะยังลบไม่ได้จนกว่าจะย้ายหรือแก้รายการเหล่านั้นก่อน</p>`);
}
function categoryManagerListHtml(cats){return cats.length?`<div class="list">${cats.map(c=>`<div class="item"><div class="grow">${esc(c.name)}</div><button class="btn danger" onclick="deleteCategory('${c.id}')">ลบ</button></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีหมวดหมู่ประเภทนี้</div>'}
function categoryManagerRender(){const t=$('#catType').value;$('#categoryManagerList').innerHTML=categoryManagerListHtml(rows('Categories').filter(c=>c.type===t));}
async function addCategory(e){e.preventDefault();const name=$('#catNewName').value.trim(),type=$('#catType').value;if(!name)return; if(rows('Categories').some(c=>c.type===type&&String(c.name).trim().toLowerCase()===name.toLowerCase()))return toast('มีหมวดหมู่นี้อยู่แล้ว');try{await save('Categories',{id:id(),name,type});categoryManager(type);}catch(x){toast('เพิ่มหมวดหมู่ไม่สำเร็จ: '+x.message)}}
async function deleteCategory(cid){const c=rows('Categories').find(x=>x.id===cid);if(!c)return;const used=rows('Transactions').some(x=>x.categoryId===cid)||rows('Budgets').some(x=>x.categoryId===cid);if(used)return toast('หมวดหมู่นี้มีธุรกรรมหรืองบประมาณใช้อยู่ กรุณาแก้รายการที่ใช้อยู่ก่อน');if(!confirm(`ยืนยันลบหมวดหมู่ “${c.name}” หรือไม่?`))return;try{const r=await api('mutate',{table:'Categories',op:'delete',id:cid});if(!r.ok)throw Error(r.error||'ลบไม่สำเร็จ');state.data.Categories=rows('Categories').filter(x=>x.id!==cid);localStorage.setItem('mf_cache',JSON.stringify(state.data));categoryManager($('#catType')?.value||c.type);renderPage();toast('ลบหมวดหมู่แล้ว');}catch(x){toast('ลบหมวดหมู่ไม่สำเร็จ: '+x.message)}}
function transferForm(transferId=''){
  const existingPair=transferId?rows('Transactions').filter(x=>x.transferId===transferId):[];
  const oldOut=existingPair.find(x=>x.type==='transfer_out')||{};
  const oldIn=existingPair.find(x=>x.type==='transfer_in')||{};
  const wallets=rows('Wallets').filter(w=>w.active!==false);
  if(wallets.length<2){toast('ต้องมีกระเป๋าเงินอย่างน้อย 2 บัญชีก่อนโอน');return}
  openModal(transferId?'แก้ไขรายการโอน':'โอนเงินระหว่างบัญชี',`<form onsubmit="submitTransfer(event,'${transferId}')">
    <div class="field"><label>บัญชีต้นทาง (เงินออก)</label><select id="trFrom" required>${wallets.map(w=>`<option value="${esc(w.id)}" ${w.id===oldOut.walletId?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>
    <div class="field"><label>บัญชีปลายทาง (เงินเข้า)</label><select id="trTo" required>${wallets.map((w,i)=>`<option value="${esc(w.id)}" ${w.id===(oldIn.walletId||wallets[1]?.id)?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div>
    <div class="field"><label>จำนวนเงินที่โอน (บาท)</label><input id="trAmount" type="number" min="0.01" step="0.01" required placeholder="0.00" value="${esc(oldOut.amount||'')}"></div>
    <div class="field"><label>วันที่โอน</label><input id="trDate" type="date" value="${esc(oldOut.date||today())}" required></div>
    <div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><input id="trNote" placeholder="เช่น โอนเงินเก็บ" value="${esc(oldOut.note||'')}"></div>
    <p class="small muted">ระบบจะปรับยอดบัญชีต้นทางและปลายทางพร้อมกัน โดยไม่นับเป็นรายรับหรือรายจ่าย</p>
    <button class="btn" type="submit" style="width:100%">${transferId?'บันทึกการแก้ไข':'ยืนยันการโอน'}</button></form>`);
}
async function submitTransfer(e,editTransferId=''){
  e.preventDefault();
  const from=$('#trFrom').value,to=$('#trTo').value,amount=Number($('#trAmount').value),date=$('#trDate').value,note=$('#trNote').value.trim();
  if(!from||!to||from===to){toast('กรุณาเลือกบัญชีต้นทางและปลายทางให้ต่างกัน');return}

async function delTransfer(transferId){

    const newItems=billDraft.map(x=>({id:x.id||id(),billId:b.id,description:x.name,amount:Number(x.amount),memberShares:JSON.stringify(selected.map(memberId=>({memberId,amount:Number((Number(x.amount)/n).toFixed(2))}))),sourceTransactionId:x.sourceTransactionId||''}));
    for(const x of newItems)await save('BillItems',x,{silent:true});
    localStorage.setItem('mf_cache',JSON.stringify(state.data));state.lastSync=new Date();closeModal();renderPage();toast(bid?'แก้ไขบิลแล้ว':'บันทึกบิลแล้ว');billDetails(b.id);
  }catch(x){toast('บันทึกไม่สำเร็จ: '+x.message);btn.disabled=false;btn.textContent='บันทึกบิล';}
}
function groupDetails(gid){let g=rows('BillGroups').find(x=>x.id===gid),m=rows('BillMembers').filter(x=>x.groupId===gid);openModal(g.name,`<div class="list">${m.map(x=>`<div class="item"><div class="grow">${esc(x.name)}</div><button class="btn danger" onclick="del('BillMembers','${x.id}');closeModal()">ลบ</button></div>`).join('')}</div>`)}
function billDetails(bid){let b=rows('Bills').find(x=>x.id===bid);if(!b)return;const items=rows('BillItems').filter(x=>x.billId===bid),members=rows('BillMembers').filter(x=>x.groupId===b.groupId);let ids=[];try{ids=JSON.parse(b.participantIds||'[]')}catch(e){}const people=members.filter(m=>ids.includes(m.id)),n=Math.max(1,Number(b.splitCount)||people.length||1),total=items.reduce((s,x)=>s+Number(x.amount||0),0),per=total/n;const date=new Date((b.date||today())+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});const rowsFull=items.map((x,i)=>`<div class="item"><div class="grow">${i+1}. ${esc(x.description)}</div><b>${fmt(x.amount)}</b></div>`).join('');const rowsSplit=items.map((x,i)=>`<div class="item"><div class="grow">${i+1}. ${esc(x.description)}</div><b>${fmt(Number(x.amount)/n)}</b></div>`).join('');openModal(b.title,`<div class="panel" style="margin:10px 0;border-top:4px solid #5145D9"><div class="small muted">${esc(date)} · ยอดเต็มก่อนหาร</div><h3 style="margin:6px 0">${esc(b.title)}</h3>${rowsFull}<div class="item"><b class="grow">รวมทั้งหมด</b><b style="color:#5145D9">${fmt(total)}</b></div></div><div class="panel" style="margin:10px 0;border-top:4px solid #10B981"><div class="small muted">${esc(date)} · หารแล้ว ${n} คน${people.length?' · '+people.map(m=>esc(m.name)).join(', '):''}</div><h3 style="margin:6px 0">${esc(b.title)}</h3>${rowsSplit}<div class="item"><b class="grow">รวมต่อคน</b><b class="positive">${fmt(per)}</b></div><div style="background:var(--mint2);border-radius:14px;padding:16px;text-align:center;margin-top:10px"><div class="small muted">แต่ละคนจ่าย</div><div style="font-size:30px;font-weight:850;color:var(--mint)">${fmt(per)}</div><div class="small muted">ยอดเต็ม ${fmt(total)} ÷ ${n} คน</div></div></div><div class="actions"><button class="btn" onclick="billForm('${b.groupId}','${b.id}')">✏️ แก้ไขบิล</button><button class="btn danger" onclick="closeModal();del('Bills','${b.id}')">ลบบิล</button><button class="btn ghost" onclick="exportBillImage('${b.id}','normal')">ดาวน์โหลดบิลปกติ</button><button class="btn secondary" onclick="exportBillImage('${b.id}','split')">ดาวน์โหลดบิลหาร</button><button class="btn" onclick="exportBillImage('${b.id}','pair')">ดาวน์โหลดภาพคู่</button></div>`);}
function exportBillImage(bid,mode){const b=rows('Bills').find(x=>x.id===bid);if(!b)return;const items=rows('BillItems').filter(x=>x.billId===bid),all=rows('BillMembers').filter(x=>x.groupId===b.groupId);let ids=[];try{ids=JSON.parse(b.participantIds||'[]')}catch(e){}const n=Math.max(1,Number(b.splitCount)||ids.length||1),total=items.reduce((s,x)=>s+Number(x.amount||0),0),per=total/n;const W=900,pad=58,lineH=66,header=300,footer=mode==='split'?260:180,H=header+items.length*lineH+footer;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#F4F6FB';x.fillRect(0,0,W,H);function card(y,h,color){x.fillStyle='#fff';x.strokeStyle=color;x.lineWidth=5;x.beginPath();x.roundRect(24,y,W-48,h,28);x.fill();x.stroke()}function drawBill(y,kind){const green=kind==='split';const color=green?'#07966B':'#5145D9';const shownTotal=green?per:total;const h=header+items.length*lineH+footer;card(y,h,green?'#10B981':'#DDE3EF');x.textAlign='center';x.fillStyle=green?'#E4FBF1':'#EEF0FF';x.beginPath();x.roundRect(330,y+34,240,54,27);x.fill();x.fillStyle=color;x.font='bold 28px sans-serif';x.fillText(green?`หารแล้ว ÷ ${n} คน`:'ยังไม่หาร',W/2,y+70);x.fillStyle='#182235';x.font='bold 42px sans-serif';x.fillText(b.title||'บิลค่าใช้จ่าย',W/2,y+145);x.fillStyle='#718096';x.font='26px sans-serif';x.fillText(`${b.date||''}${green?' · '+n+' คน':''}`,W/2,y+194);x.strokeStyle='#D8E0EA';x.setLineDash([12,10]);x.lineWidth=4;x.beginPath();x.moveTo(pad,y+225);x.lineTo(W-pad,y+225);x.stroke();x.setLineDash([]);items.forEach((it,i)=>{const yy=y+285+i*lineH;x.textAlign='left';x.fillStyle='#263244';x.font='28px sans-serif';x.fillText(`${i+1}. ${it.description}`,pad,yy);x.textAlign='right';x.font='bold 28px sans-serif';x.fillText(fmt(green?Number(it.amount)/n:it.amount),W-pad,yy);x.strokeStyle='#E5EAF0';x.beginPath();x.moveTo(pad,yy+20);x.lineTo(W-pad,yy+20);x.stroke();});const fy=y+285+items.length*lineH;x.textAlign='left';x.fillStyle='#1D2939';x.font='bold 34px sans-serif';x.fillText(green?`รวม ÷ ${n}`:'รวมทั้งหมด',pad,fy+24);x.textAlign='right';x.fillStyle=color;x.font='bold 38px sans-serif';x.fillText(fmt(shownTotal),W-pad,fy+24);if(green){x.fillStyle='#DDF8EC';x.beginPath();x.roundRect(pad,fy+58,W-2*pad,125,24);x.fill();x.textAlign='center';x.fillStyle='#07865F';x.font='26px sans-serif';x.fillText('คนละ',W/2,fy+98);x.font='bold 52px sans-serif';x.fillText(fmt(per),W/2,fy+153);x.font='22px sans-serif';x.fillText(`ยอดเต็ม ${fmt(total)}`,W/2,fy+184);}}
if(mode==='pair'){const h=header+items.length*lineH+footer;const fullH=h*2+28;c.height=fullH;x.fillStyle='#F4F6FB';x.fillRect(0,0,W,fullH);drawBill(0,'normal');drawBill(h+28,'split');}else drawBill(0,mode);const imageUrl=c.toDataURL('image/png');openModal('ตัวอย่างภาพบิล',`<img class="bill-preview" src="${imageUrl}" alt="ภาพบิล MONEY FLOW"><p class="preview-hint">แตะค้างที่ภาพ แล้วเลือก “ดาวน์โหลดรูปภาพ” หรือ “บันทึกภาพ” เพื่อเก็บลงเครื่อง</p><button class="btn ghost" style="width:100%" onclick="closeModal()">ปิด</button>`);}
function reconcileForm(rid=''){let w=rows('Wallets');if(!w.length)return toast('กรุณาสร้างกระเป๋าเงินก่อน');let old=rows('BankReconciliation').find(x=>String(x.id)===String(rid))||{},wid=old.walletId||w[0].id;openModal(rid?'แก้ไขผลตรวจสอบบัญชี':'ตรวจสอบยอดบัญชี',`<form onsubmit="submitRecon(event)"><input type="hidden" id="rId" value="${esc(rid)}"><div class="field"><label>บัญชี</label><select id="rWallet">${w.map(x=>`<option value="${esc(x.id)}" ${x.id===wid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>ยอดเงินจริง</label><input id="rActual" type="number" step="0.01" value="${old.actualBalance??''}" required></div><div class="field"><label>วันที่ตรวจสอบ</label><input id="rDate" type="date" value="${esc(String(old.date||today()).slice(0,10))}" required></div><div class="field"><label>หมายเหตุ</label><input id="rNote" value="${esc(old.note||'')}"></div><button class="btn" style="width:100%">${rid?'บันทึกการแก้ไข':'ตรวจสอบและบันทึก'}</button></form>`)}async function submitRecon(e){e.preventDefault();let rid=$('#rId').value,wid=$('#rWallet').value,w=rows('Wallets').find(x=>x.id===wid);if(!w)return toast('ไม่พบบัญชีที่เลือก');let system=Number(w.openingBalance||0)+rows('Transactions').filter(x=>x.walletId===wid).reduce((a,x)=>a+txWalletImpact(x),0),actual=+$('#rActual').value;try{await save('BankReconciliation',{id:rid||id(),walletId:wid,date:$('#rDate').value,actualBalance:actual,systemBalance:system,difference:actual-system,note:$('#rNote').value});closeModal();toast(Math.abs(actual-system)<.005?'ยอดตรงกัน':'พบส่วนต่าง '+fmt(actual-system))}catch(x){toast(x.message)}}
function exportCSV(){let a=rows('Transactions'),header=['id','type','amount','category','wallet','date','note'];let csv=[header.join(','),...a.map(x=>[x.id,x.type,x.amount,catName(x.categoryId),walletName(x.walletId),x.date,x.note].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\n');download('money-flow-transactions.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function backup(){download('money-flow-backup.json',JSON.stringify(state.data,null,2),'application/json')}function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function changeApi(){let v=prompt('Google Apps Script Web App URL (ลงท้ายด้วย /exec)',state.api);if(v){state.api=v.trim();localStorage.setItem('mf_api',state.api);refresh()}}
async function boot(){
  // Render the app shell immediately. Network access must never block the UI.
  document.body.classList.toggle('dark',state.theme==='dark');
  let cached=localStorage.getItem('mf_cache');
  if(cached){try{state.data=JSON.parse(cached)||{};}catch(e){state.data={};}}
  tables.forEach(t=>state.data[t] ||= []);
  applyAccent();
  renderShell();
  const syncNodes=()=>document.querySelectorAll('.sync');
  const setSync=(msg)=>syncNodes().forEach(n=>n.textContent=msg);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(e=>console.warn('SW registration:',e));
  }
  if(!state.api){
    setSync('ยังไม่ได้เชื่อมต่อ Google Sheets');
    toast('กรุณาเข้า ตั้งค่า → เปลี่ยน URL เพื่อเชื่อมต่อข้อมูล');
    return;
  }
  setSync('แสดงข้อมูลในเครื่อง · กำลังซิงค์เบื้องหลัง');
  // Bound startup wait; the screen is already usable even if Apps Script is slow.
  const startup=loadData();
  const timeout=new Promise((_,reject)=>setTimeout(()=>reject(Error('การเชื่อมต่อใช้เวลานานเกินไป')),12000));
  try{
    await Promise.race([startup,timeout]);
    renderShell();
    setSync('ซิงค์ล่าสุด '+new Date().toLocaleTimeString('th-TH'));
    if(pendingOps().length)toast('มีรายการรอซิงค์ '+pendingOps().length+' รายการ');
  }catch(e){
    console.warn('MONEY FLOW startup sync:',e);
    setSync('ยังไม่ซิงค์ · ใช้ข้อมูลในเครื่องได้');
    toast('เชื่อมต่อ Google Sheets ไม่สำเร็จ แต่ยังใช้หน้าจอและข้อมูลที่บันทึกในเครื่องได้');
  }
}
window.addEventListener('online',()=>{flushQueue();refresh()});
boot();
</script></body></html>
