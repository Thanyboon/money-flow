<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MONEY FLOW"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>MONEY FLOW</title><style>
:root{--bg:#f4f7f8;--panel:#fff;--text:#17212f;--muted:#718096;--line:#e5ebef;--mint:#10b981;--mint2:#d1fae5;--navy:#101827;--red:#f36b82;--shadow:0 8px 28px #17212f0c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.dark{--bg:#0e1724;--panel:#172334;--text:#edf4f5;--muted:#a2b0c0;--line:#2a3a4e;--mint2:#183d34;--shadow:0 8px 28px #0003}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100dvh}.sidebar{display:none}.main{max-width:1200px;margin:auto;padding:20px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px}.logo{width:38px;height:38px;border-radius:13px;background:var(--mint);display:grid;place-items:center;color:#073b2c;font-size:22px}.muted{color:var(--muted)}.small{font-size:12px}.title{font-size:25px;font-weight:800;margin:5px 0 18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#102337,#174b3b);color:#fff;border:0}.hero .muted{color:#b8d4cc}.balance{font-size:34px;font-weight:800;letter-spacing:-1px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px}.metric strong{display:block;font-size:20px;margin-top:8px}.positive{color:#16a36d}.negative{color:var(--red)}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;font-weight:750}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--mint);color:#073b2c;font-weight:750}.btn.secondary{background:var(--mint2);color:var(--text)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{background:#ffe4e8;color:#a21d38}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:9px}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.bubble{width:40px;height:40px;border-radius:13px;background:var(--mint2);display:grid;place-items:center}.grow{flex:1;min-width:0}.amount{font-weight:800;white-space:nowrap}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:var(--muted);font-size:10px;display:grid;gap:4px;justify-items:center;min-width:48px}.nav button span{font-size:20px}.nav button.active{color:var(--mint);font-weight:800}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:12px;border-radius:11px;min-height:44px}textarea{min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{flex:1;min-width:150px}.pill{display:inline-block;border-radius:99px;background:var(--mint2);padding:5px 9px;font-size:11px}.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);border-radius:99px}.chart{display:flex;align-items:end;gap:9px;height:130px;padding:10px 2px}.chartcol{flex:1;display:flex;gap:3px;align-items:end;height:100%}.chartcol i{flex:1;border-radius:5px 5px 2px 2px;background:var(--mint);min-height:3px}.chartcol b{flex:1;border-radius:5px 5px 2px 2px;background:var(--red);min-height:3px}.labels{display:flex;justify-content:space-around;color:var(--muted);font-size:10px}.empty{text-align:center;color:var(--muted);padding:28px 8px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;justify-content:center;z-index:10;padding:12px}.modal.show{display:flex}.sheet{background:var(--panel);color:var(--text);width:min(620px,100%);max-height:90dvh;overflow:auto;border-radius:22px;padding:20px}.sheethead{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#102337;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;display:none;max-width:90%;font-size:13px}.toast.show{display:block}.login{max-width:420px;margin:12vh auto;padding:22px}.sync{font-size:11px;color:var(--muted)}.bill-card{border-radius:18px;padding:16px;background:var(--panel);border:1px solid var(--line)}@media(min-width:760px){.app{display:flex}.sidebar{display:flex;flex-direction:column;width:230px;background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;gap:7px;position:sticky;top:0;height:100dvh}.sidebar button{text-align:left;padding:12px;border:0;border-radius:11px;background:transparent;color:var(--text)}.sidebar button.active{background:var(--mint2);color:var(--mint);font-weight:800}.main{flex:1;padding:28px 30px 50px}.nav{display:none}.grid.metrics{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.formgrid{grid-template-columns:1fr 1fr}}@media(min-width:1000px){.main{padding:34px 42px 60px}.contentgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}}
</style></head><body><div id="app" class="app"><div class="login panel"><div class="brand"><div class="logo">↗</div>MONEY FLOW</div><h2>กำลังเชื่อมต่อ</h2><p class="muted" id="loginStatus">กำลังเตรียมข้อมูลการเงินของคุณ…</p></div></div><div class="toast" id="toast"></div><div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="sheethead"><h3 id="modalTitle">เพิ่มรายการ</h3><button class="btn ghost" onclick="closeModal()">ปิด</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s);const state={api:localStorage.getItem('mf_api')||'',data:{},page:'home',theme:localStorage.getItem('mf_theme')||'light'};
const tables=['Transactions','Wallets','Categories','Budgets','SavingsGoals','SavingsHistory','BankReconciliation','BillGroups','BillMembers','Bills','BillItems','BillPayments'];
const fmt=n=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:2}).format(Number(n)||0);const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'});const id=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function toast(s){let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function postApi(params){
  return new Promise((resolve,reject)=>{
    if(!state.api) return reject(Error('กรุณาตั้งค่า Google Apps Script URL'));
    const nonce=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/[^a-zA-Z0-9]/g,'');
    const frame=document.createElement('iframe'),form=document.createElement('form');
    const frameName='mf_frame_'+nonce;
    frame.name=frameName;frame.style.display='none';frame.setAttribute('aria-hidden','true');
    form.method='POST';form.action=state.api;form.target=frameName;form.style.display='none';
    Object.entries({...params,nonce}).forEach(([k,v])=>{
      const input=document.createElement('input');input.type='hidden';input.name=k;input.value=String(v??'');form.appendChild(input);
    });
    let finished=false;
    const cleanup=()=>{window.removeEventListener('message',onMessage);clearTimeout(timer);form.remove();frame.remove()};
    const finish=(fn,value)=>{if(finished)return;finished=true;cleanup();fn(value)};
    const onMessage=(event)=>{
      // Apps Script HtmlService may wrap the response in an additional sandbox iframe.
      // The one-time random nonce binds the reply to this request.
      const data=event.data;
      if(!data||data.mf!==true||data.nonce!==nonce)return;
      finish(resolve,data.payload);
    };
    window.addEventListener('message',onMessage);
    const timer=setTimeout(()=>finish(reject,Error('หมดเวลาการเชื่อมต่อ กรุณาตรวจสอบ URL และอินเทอร์เน็ต')),25000);
    document.body.append(frame,form);
    form.submit();
  });
}
async function api(action,extra={}){return postApi({action,...extra})}async function loadData(){let r=await api('bootstrap');if(!r.ok)throw Error(r.error);state.data=r.data||{};tables.forEach(t=>state.data[t] ||= []);localStorage.setItem('mf_cache',JSON.stringify(state.data));state.lastSync=new Date()}
async function save(table,row){
  row={...row,id:row.id||id()};
  const r=await api('mutate',{table,op:'upsert',row:JSON.stringify(row)});
  if(!r.ok)throw Error(r.error);
  const saved=r.row||row;
  const list=state.data[table]||(state.data[table]=[]);
  const index=list.findIndex(x=>String(x.id)===String(saved.id));
  if(index>=0)list[index]=saved;else list.push(saved);
  state.lastSync=new Date();
  localStorage.setItem('mf_cache',JSON.stringify(state.data));
  renderPage();
  toast('บันทึกข้อมูลแล้ว');
  return saved;
}
async function del(table,recordId){
  const item=rows(table).find(x=>String(x.id)===String(recordId));if(!item)return;
  if(table==='Wallets'&&rows('Transactions').some(x=>x.walletId===recordId))return toast('กระเป๋านี้มีธุรกรรมอยู่ กรุณาลบหรือย้ายธุรกรรมก่อน เพื่อป้องกันข้อมูลการเงินสูญหาย');
  const label=({Transactions:'ธุรกรรม',Wallets:'กระเป๋าเงิน',SavingsGoals:'เป้าหมายการออม',Budgets:'งบประมาณ',Bills:'บิล',BillGroups:'กลุ่มหารบิล',BillMembers:'สมาชิก',BankReconciliation:'ประวัติตรวจสอบบัญชี',SavingsHistory:'ประวัติการออม'})[table]||'รายการ';
  if(!confirm(`ยืนยันลบ${label}นี้? การลบไม่สามารถย้อนกลับได้`))return;
  const related=[];
  if(table==='Bills'){related.push(...rows('BillItems').filter(x=>x.billId===recordId).map(x=>['BillItems',x.id]),...rows('BillPayments').filter(x=>x.billId===recordId).map(x=>['BillPayments',x.id]));}
  if(table==='BillGroups'){const bids=rows('Bills').filter(x=>x.groupId===recordId).map(x=>x.id);related.push(...rows('BillMembers').filter(x=>x.groupId===recordId).map(x=>['BillMembers',x.id]));for(const bid of bids){related.push(['Bills',bid],...rows('BillItems').filter(x=>x.billId===bid).map(x=>['BillItems',x.id]),...rows('BillPayments').filter(x=>x.billId===bid).map(x=>['BillPayments',x.id]));}}
  if(table==='SavingsGoals')related.push(...rows('SavingsHistory').filter(x=>x.goalId===recordId).map(x=>['SavingsHistory',x.id]));
  try{for(const [t,rid] of [...related,[table,recordId]]){const r=await api('mutate',{table:t,op:'delete',id:rid});if(!r.ok)throw Error(r.error||'ลบข้อมูลไม่สำเร็จ');state.data[t]=(state.data[t]||[]).filter(x=>String(x.id)!==String(rid));}state.lastSync=new Date();localStorage.setItem('mf_cache',JSON.stringify(state.data));renderPage();toast('ลบข้อมูลแล้ว');}catch(e){toast('ลบไม่สำเร็จ: '+e.message);}
}
function rows(t){return state.data[t]||[]}function walletName(id){return rows('Wallets').find(x=>x.id===id)?.name||'ไม่ระบุบัญชี'}function catName(id){return rows('Categories').find(x=>x.id===id)?.name||'อื่น ๆ'}function monthNow(){return today().slice(0,7)}function txTotals(){let m=monthNow(),tx=rows('Transactions').filter(x=>String(x.date).slice(0,7)===m),inc=tx.filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0),exp=tx.filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0);let bal=rows('Wallets').filter(w=>w.active!==false&&w.active!=='false').reduce((a,w)=>a+Number(w.openingBalance||0),0)+rows('Transactions').reduce((a,x)=>a+(x.type==='income'?1:-1)*Number(x.amount),0);return{inc,exp,bal,tx}}
function renderShell(){document.body.classList.toggle('dark',state.theme==='dark');$('#app').innerHTML=`<aside class="sidebar"><div class="brand" style="margin:4px 8px 22px"><div class="logo">↗</div>MONEY FLOW</div>${navItems().map(n=>`<button class="${state.page===n.id?'active':''}" onclick="go('${n.id}')">${n.icon}　${n.label}</button>`).join('')}<div style="margin-top:auto" class="sync">ซิงค์ล่าสุด: ${state.lastSync?.toLocaleTimeString('th-TH')||'-'}</div></aside><main class="main"><header class="top"><div><div class="brand"><div class="logo">↗</div><span>MONEY FLOW</span></div><div class="sync">${state.lastSync?'ซิงค์ล่าสุด '+state.lastSync.toLocaleTimeString('th-TH'):'พร้อมใช้งาน'}</div></div><div class="actions"><button class="btn ghost" onclick="toggleTheme()">${state.theme==='dark'?'☀️':'🌙'}</button><button class="btn ghost" onclick="refresh()">↻</button></div></header><div id="page"></div></main><nav class="nav">${navItems().slice(0,5).map(n=>`<button class="${state.page===n.id?'active':''}" onclick="go('${n.id}')"><span>${n.icon}</span>${n.short||n.label}</button>`).join('')}</nav>`;renderPage()}
function navItems(){return[{id:'home',label:'ภาพรวม',short:'หน้าหลัก',icon:'⌂'},{id:'transactions',label:'ธุรกรรม',short:'รายการ',icon:'↔'},{id:'wallets',label:'กระเป๋าเงิน',icon:'▣'},{id:'savings',label:'เป้าหมายออม',short:'ออมเงิน',icon:'◎'},{id:'budgets',label:'งบประมาณ',icon:'▤'},{id:'bills',label:'หารบิลกับเพื่อน',icon:'♧'},{id:'reconcile',label:'ตรวจสอบบัญชี',icon:'✓'},{id:'reports',label:'รายงาน',icon:'▥'},{id:'settings',label:'ตั้งค่า',icon:'⚙'}]}
function go(p){state.page=p;renderShell()}function toggleTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('mf_theme',state.theme);renderShell()}async function refresh(){try{await loadData();renderPage();toast('ซิงค์ข้อมูลล่าสุดแล้ว')}catch(e){toast(e.message)}}
function renderPage(){let el=$('#page');if(!el)return;const p=state.page;const map={home:homePage,transactions:transactionsPage,wallets:walletsPage,savings:savingsPage,budgets:budgetsPage,bills:billsPage,reconcile:reconcilePage,reports:reportsPage,settings:settingsPage};el.innerHTML=(map[p]||homePage)()}
function homePage(){let t=txTotals(),all=rows('Transactions').slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);let cats={};t.tx.filter(x=>x.type==='expense').forEach(x=>cats[x.categoryId]=(cats[x.categoryId]||0)+Number(x.amount));let top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);let months=Array.from({length:6},(_,i)=>{let d=new Date();d.setMonth(d.getMonth()-(5-i));let m=d.toLocaleDateString('en-CA').slice(0,7);let a=rows('Transactions').filter(x=>String(x.date).slice(0,7)===m);return{m,inc:a.filter(x=>x.type==='income').reduce((s,x)=>s+ +x.amount,0),exp:a.filter(x=>x.type==='expense').reduce((s,x)=>s+ +x.amount,0)}});let max=Math.max(1,...months.flatMap(x=>[x.inc,x.exp]));return `<h1 class="title">ภาพรวมการเงิน</h1><section class="panel hero"><div class="muted">ยอดเงินคงเหลือรวมทุกกระเป๋า</div><div class="balance">${fmt(t.bal)}</div><div class="small">ยอดคำนวณจากยอดตั้งต้นและธุรกรรมทั้งหมด</div></section><div class="grid metrics" style="margin-top:12px"><div class="metric"><span class="muted small">รายรับเดือนนี้</span><strong class="positive">${fmt(t.inc)}</strong></div><div class="metric"><span class="muted small">รายจ่ายเดือนนี้</span><strong class="negative">${fmt(t.exp)}</strong></div><div class="metric"><span class="muted small">สุทธิเดือนนี้</span><strong>${fmt(t.inc-t.exp)}</strong></div><div class="metric"><span class="muted small">กระเป๋าเงิน</span><strong>${rows('Wallets').length} บัญชี</strong></div></div><div class="contentgrid"><div><div class="section">รายรับและรายจ่าย 6 เดือน</div><div class="panel"><div class="chart">${months.map(x=>`<div class="chartcol"><i style="height:${x.inc/max*100}%"></i><b style="height:${x.exp/max*100}%"></b></div>`).join('')}</div><div class="labels">${months.map(x=>x.m.slice(5)).map(x=>`<span>${x}</span>`).join('')}</div><div class="small muted" style="margin-top:12px">🟩 รายรับ　🟥 รายจ่าย</div></div><div class="section">รายการล่าสุด <button class="btn secondary" onclick="go('transactions')">ดูทั้งหมด</button></div><div class="panel">${txList(all)}</div></div><div><div class="section">หมวดหมู่ที่ใช้จ่ายสูง</div><div class="panel">${top.length?top.map(([k,v])=>`<div style="margin:12px 0"><div class="item" style="border:0;padding:2px 0"><span class="grow">${esc(catName(k))}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/Math.max(1,...top.map(x=>x[1]))*100}%"></i></div></div>`).join(''):'<div class="empty">ยังไม่มีข้อมูลรายจ่ายเดือนนี้</div>'}</div><div class="section">ทางลัด</div><div class="panel actions"><button class="btn" onclick="txForm('expense')">− รายจ่าย</button><button class="btn" onclick="txForm('income')">＋ รายรับ</button><button class="btn secondary" onclick="walletForm()">＋ กระเป๋า</button></div></div></div>`}
function txList(list){return list.length?`<div class="list">${list.map(x=>`<div class="item"><div class="bubble">${x.type==='income'?'↗':'↘'}</div><div class="grow"><b>${esc(catName(x.categoryId))}</b><div class="small muted">${esc(x.date)} · ${esc(walletName(x.walletId))} ${x.note?'· '+esc(x.note):''}</div></div><div class="amount ${x.type==='income'?'positive':'negative'}">${x.type==='income'?'+':'−'}${fmt(x.amount)}</div><button class="btn ghost" onclick="txForm('', '${x.id}')">แก้</button><button class="btn danger" onclick="del('Transactions','${x.id}')">ลบ</button></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีรายการ</div>'}
function transactionsPage(){let list=rows('Transactions').slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `<h1 class="title">ธุรกรรม</h1><div class="actions"><button class="btn" onclick="txForm('expense')">＋ เพิ่มรายจ่าย</button><button class="btn secondary" onclick="txForm('income')">＋ เพิ่มรายรับ</button><button class="btn ghost" onclick="categoryManager()">⚙️ จัดการหมวดหมู่</button></div><div class="toolbar"><input id="txSearch" placeholder="ค้นหาหมายเหตุหรือหมวดหมู่" oninput="filterTx()"><select id="txType" onchange="filterTx()"><option value="">ทุกประเภท</option><option value="income">รายรับ</option><option value="expense">รายจ่าย</option></select><input id="txMonth" type="month" value="${monthNow()}" onchange="filterTx()"></div><div class="panel" id="txResults">${txList(list)}</div>`}
function filterTx(){let q=$('#txSearch').value.toLowerCase(),typ=$('#txType').value,m=$('#txMonth').value;let a=rows('Transactions').filter(x=>(!q||(String(x.note||'')+' '+catName(x.categoryId)).toLowerCase().includes(q))&&(!typ||x.type===typ)&&(!m||String(x.date).startsWith(m)));$('#txResults').innerHTML=txList(a)}
function walletsPage(){let w=rows('Wallets');return `<h1 class="title">กระเป๋าเงิน</h1><button class="btn" onclick="walletForm()">＋ เพิ่มกระเป๋าเงิน</button><div class="grid" style="margin-top:14px">${w.map(x=>{let bal=Number(x.openingBalance||0)+rows('Transactions').filter(t=>t.walletId===x.id).reduce((a,t)=>a+(t.type==='income'?1:-1)*Number(t.amount),0);return `<div class="panel"><div class="bubble">▣</div><div class="section">${esc(x.name)} <div class="actions"><button class="btn ghost" onclick="walletForm('${x.id}')">แก้ไข</button><button class="btn danger" onclick="del('Wallets','${x.id}')">ลบ</button></div></div><div class="muted small">${esc(x.type||'บัญชี')}</div><strong style="font-size:23px">${fmt(bal)}</strong><div class="small muted">ยอดตั้งต้น ${fmt(x.openingBalance)}</div></div>`}).join('')}</div>${w.length?'':'<div class="empty">เพิ่มกระเป๋าเงินแรกของคุณ</div>'}`}
function savingsPage(){let a=rows('SavingsGoals');return `<h1 class="title">เป้าหมายการออม</h1><button class="btn" onclick="goalForm()">＋ สร้างเป้าหมาย</button><div class="grid" style="margin-top:14px">${a.map(x=>{let pct=Math.min(100,Number(x.currentAmount)/Math.max(1,Number(x.targetAmount))*100);return `<div class="panel"><div class="section">${esc(x.name)} <div class="actions"><button class="btn ghost" onclick="goalForm('${x.id}')">แก้</button><button class="btn danger" onclick="del('SavingsGoals','${x.id}')">ลบ</button></div></div><strong style="font-size:24px">${fmt(x.currentAmount)}</strong><div class="small muted">เป้าหมาย ${fmt(x.targetAmount)}</div><div class="bar" style="margin:12px 0"><i style="width:${pct}%"></i></div><div class="small">${pct.toFixed(1)}% · กำหนด ${esc(x.deadline||'-')}</div><button class="btn secondary" style="margin-top:12px" onclick="savingAction('${x.id}')">บันทึกการออม/ถอน</button></div>`}).join('')}</div>${a.length?'':'<div class="empty">ยังไม่มีเป้าหมายการออม</div>'}`}
function budgetsPage(){let m=monthNow(),a=rows('Budgets').filter(x=>x.month===m);return `<h1 class="title">งบประมาณ ${m}</h1><button class="btn" onclick="budgetForm()">＋ ตั้งงบประมาณ</button><div class="panel" style="margin-top:14px">${a.map(x=>{let spent=rows('Transactions').filter(t=>t.type==='expense'&&t.categoryId===x.categoryId&&String(t.date).startsWith(m)).reduce((s,t)=>s+Number(t.amount),0),pct=spent/Math.max(1,Number(x.amount))*100;return `<div style="margin:12px 0"><div class="item"><div class="grow"><b>${esc(catName(x.categoryId))}</b><div class="small muted">ใช้ ${fmt(spent)} จาก ${fmt(x.amount)}</div></div><div class="actions"><button class="btn ghost" onclick="budgetForm('${x.id}')">แก้</button><button class="btn danger" onclick="del('Budgets','${x.id}')">ลบ</button></div></div><div class="bar"><i style="width:${Math.min(100,pct)}%;background:${pct>=100?'var(--red)':'var(--mint)'}"></i></div><div class="small ${pct>=100?'negative':'muted'}">${pct.toFixed(0)}% ${pct>=100?'เกินงบ':pct>=80?'ใกล้เกินงบ':'ของงบประมาณ'}</div></div>`}).join('')||'<div class="empty">ยังไม่ได้ตั้งงบประมาณเดือนนี้</div>'}</div>`}
function billsPage(){let groups=rows('BillGroups');return `<h1 class="title">บิลหารเงิน</h1><button class="btn" onclick="groupForm()">＋ สร้างกลุ่ม</button><div class="grid" style="margin-top:14px">${groups.map(g=>`<div class="panel"><div class="section">${esc(g.name)} <button class="btn" onclick="billForm('${g.id}')">＋ เพิ่มบิล</button></div><div class="small muted">${rows('BillMembers').filter(m=>m.groupId===g.id).length} สมาชิก · ${rows('Bills').filter(b=>b.groupId===g.id).length} บิล</div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="memberForm('${g.id}')">เพิ่มเพื่อน</button><button class="btn ghost" onclick="groupDetails('${g.id}')">สมาชิก</button><button class="btn danger" onclick="del('BillGroups','${g.id}')">ลบกลุ่ม</button></div></div>`).join('')}</div>${groups.length?'':'<div class="empty">สร้างกลุ่มก่อน เพื่อเลือกคนที่ร่วมหาร</div>'}<div class="section">บิลที่บันทึกไว้</div><div class="panel">${rows('Bills').slice().reverse().map(b=>`<div class="item"><div class="grow"><b>${esc(b.title)}</b><div class="small muted">${esc(b.date)} · ${esc(rows('BillGroups').find(g=>g.id===b.groupId)?.name||'')}</div><div class="small muted">${(rows('BillItems').filter(i=>i.billId===b.id)).length} รายการ · ${Number(b.splitCount||0)} คน</div></div><b>${fmt(b.fullTotal||b.total)}</b><button class="btn ghost" onclick="billDetails('${b.id}')">เปิด</button><button class="btn danger" onclick="del('Bills','${b.id}')">ลบ</button></div>`).join('')||'<div class="empty">ยังไม่มีบิล</div>'}</div>`}
function reconcilePage(){let w=rows('Wallets');return `<h1 class="title">ตรวจสอบยอดบัญชี</h1><p class="muted">เปรียบเทียบยอดตามระบบกับยอดเงินจริงที่คุณกรอกจากธนาคาร</p><button class="btn" onclick="reconcileForm()">＋ ตรวจสอบยอดใหม่</button><div class="panel" style="margin-top:14px">${rows('BankReconciliation').slice().reverse().map(x=>`<div class="item"><div class="grow"><b>${esc(walletName(x.walletId))}</b><div class="small muted">${esc(x.date)}</div><div class="small">ระบบ ${fmt(x.systemBalance)} · จริง ${fmt(x.actualBalance)}</div></div><b class="${Math.abs(Number(x.difference))<0.005?'positive':'negative'}">${fmt(x.difference)}</b></div>`).join('')||'<div class="empty">ยังไม่มีประวัติการตรวจสอบ</div>'}</div>`}
function reportsPage(){let t=txTotals(),cats={};rows('Transactions').filter(x=>x.type==='expense').forEach(x=>cats[x.categoryId]=(cats[x.categoryId]||0)+Number(x.amount));return `<h1 class="title">รายงานการเงิน</h1><div class="grid"><div class="metric"><span class="muted small">รายรับสะสม</span><strong class="positive">${fmt(rows('Transactions').filter(x=>x.type==='income').reduce((a,x)=>a+Number(x.amount),0))}</strong></div><div class="metric"><span class="muted small">รายจ่ายสะสม</span><strong class="negative">${fmt(rows('Transactions').filter(x=>x.type==='expense').reduce((a,x)=>a+Number(x.amount),0))}</strong></div></div><div class="section">ค่าใช้จ่ายตามหมวดหมู่</div><div class="panel">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="item"><div class="grow">${esc(catName(k))}</div><b>${fmt(v)}</b></div>`).join('')||'<div class="empty">ไม่มีข้อมูล</div>'}</div><div class="section">ส่งออกข้อมูล</div><button class="btn secondary" onclick="exportCSV()">ดาวน์โหลดธุรกรรม CSV</button>`}
function settingsPage(){return `<h1 class="title">ตั้งค่า</h1><div class="panel"><div class="section">การเชื่อมต่อ</div><div class="small muted">Apps Script URL</div><div style="overflow-wrap:anywhere">${esc(state.api)}</div><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="refresh()">ซิงค์ข้อมูล</button><button class="btn ghost" onclick="changeApi()">เปลี่ยน URL</button></div><div class="section">ธีม</div><button class="btn secondary" onclick="toggleTheme()">สลับ Light / Dark Mode</button><div class="section">ข้อมูลสำรอง</div><button class="btn secondary" onclick="backup()">ส่งออกข้อมูลทั้งหมด JSON</button><span class="small muted">โหมดไม่ใช้รหัสผ่าน</span></div><p class="small muted">MONEY FLOW ${'v1.3.2-category-manager'} · ข้อมูลหลักเก็บใน Google Sheets</p>`}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}
function categoryManager(type='expense'){
  const cats=rows('Categories').filter(c=>c.type===type);
  openModal('จัดการหมวดหมู่รายรับ / รายจ่าย',`<div class="field"><label>เลือกประเภทหมวดหมู่</label><select id="catType" onchange="categoryManagerRender()"><option value="expense" ${type==='expense'?'selected':''}>รายจ่าย</option><option value="income" ${type==='income'?'selected':''}>รายรับ</option></select></div><div id="categoryManagerList">${categoryManagerListHtml(cats)}</div><form onsubmit="addCategory(event)" class="panel" style="margin-top:14px"><div class="field"><label>ชื่อหมวดหมู่ใหม่</label><input id="catNewName" maxlength="40" required placeholder="เช่น ค่าเดินทาง / เงินเดือน"></div><button class="btn" style="width:100%">＋ เพิ่มหมวดหมู่</button></form><p class="small muted">หมวดหมู่ที่มีรายการธุรกรรมหรืองบประมาณใช้อยู่ จะยังลบไม่ได้จนกว่าจะย้ายหรือแก้รายการเหล่านั้นก่อน</p>`);
}
function categoryManagerListHtml(cats){return cats.length?`<div class="list">${cats.map(c=>`<div class="item"><div class="grow">${esc(c.name)}</div><button class="btn danger" onclick="deleteCategory('${c.id}')">ลบ</button></div>`).join('')}</div>`:'<div class="empty">ยังไม่มีหมวดหมู่ประเภทนี้</div>'}
function categoryManagerRender(){const t=$('#catType').value;$('#categoryManagerList').innerHTML=categoryManagerListHtml(rows('Categories').filter(c=>c.type===t));}
async function addCategory(e){e.preventDefault();const name=$('#catNewName').value.trim(),type=$('#catType').value;if(!name)return; if(rows('Categories').some(c=>c.type===type&&String(c.name).trim().toLowerCase()===name.toLowerCase()))return toast('มีหมวดหมู่นี้อยู่แล้ว');try{await save('Categories',{id:id(),name,type});categoryManager(type);}catch(x){toast('เพิ่มหมวดหมู่ไม่สำเร็จ: '+x.message)}}
async function deleteCategory(cid){const c=rows('Categories').find(x=>x.id===cid);if(!c)return;const used=rows('Transactions').some(x=>x.categoryId===cid)||rows('Budgets').some(x=>x.categoryId===cid);if(used)return toast('หมวดหมู่นี้มีธุรกรรมหรืองบประมาณใช้อยู่ กรุณาแก้รายการที่ใช้อยู่ก่อน');if(!confirm(`ยืนยันลบหมวดหมู่ “${c.name}” หรือไม่?`))return;try{const r=await api('mutate',{table:'Categories',op:'delete',id:cid});if(!r.ok)throw Error(r.error||'ลบไม่สำเร็จ');state.data.Categories=rows('Categories').filter(x=>x.id!==cid);localStorage.setItem('mf_cache',JSON.stringify(state.data));categoryManager($('#catType')?.value||c.type);renderPage();toast('ลบหมวดหมู่แล้ว');}catch(x){toast('ลบหมวดหมู่ไม่สำเร็จ: '+x.message)}}
function txForm(type='',rid=''){let old=rows('Transactions').find(x=>x.id===rid)||{},t=type||old.type||'expense',cats=rows('Categories').filter(x=>x.type===t),opts=a=>a.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');openModal(rid?'แก้ไขธุรกรรม':'เพิ่มธุรกรรม',`<form onsubmit="submitTx(event,'${rid}')"><div class="field"><label>ประเภท</label><select id="fType" onchange="refreshCatOptions()"><option value="expense" ${t==='expense'?'selected':''}>รายจ่าย</option><option value="income" ${t==='income'?'selected':''}>รายรับ</option></select></div><div class="field"><label>จำนวนเงิน (บาท)</label><input id="fAmount" type="number" min="0.01" step="0.01" required value="${esc(old.amount||'')}"></div><div class="formgrid"><div class="field"><label>หมวดหมู่</label><select id="fCategory">${opts(cats)}</select></div><div class="field"><label>กระเป๋าเงิน</label><select id="fWallet" required>${opts(rows('Wallets'))}</select></div></div><div class="field"><label>วันที่</label><input id="fDate" type="date" value="${esc(old.date||today())}" required></div><div class="field"><label>หมายเหตุ</label><textarea id="fNote">${esc(old.note||'')}</textarea></div><button class="btn" style="width:100%">บันทึก</button>${rid?`<button type="button" class="btn danger" style="width:100%;margin-top:8px" onclick="del('Transactions','${rid}');closeModal()">ลบรายการ</button>`:''}</form>`);$('#fWallet').value=old.walletId||rows('Wallets')[0]?.id||'';$('#fCategory').value=old.categoryId||cats[0]?.id||''}
function refreshCatOptions(){let t=$('#fType').value,a=rows('Categories').filter(x=>x.type===t);$('#fCategory').innerHTML=a.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')||'<option value="">ยังไม่มีหมวดหมู่ — เพิ่มได้จากปุ่มจัดการ</option>'}
async function submitTx(e,rid){e.preventDefault();try{await save('Transactions',{id:rid||id(),type:$('#fType').value,amount:Number($('#fAmount').value),categoryId:$('#fCategory').value,walletId:$('#fWallet').value,date:$('#fDate').value,note:$('#fNote').value});closeModal()}catch(x){toast(x.message)}}
function walletForm(rid=''){let x=rows('Wallets').find(x=>x.id===rid)||{};openModal(rid?'แก้ไขกระเป๋า':'เพิ่มกระเป๋าเงิน',`<form onsubmit="submitWallet(event,'${rid}')"><div class="field"><label>ชื่อบัญชี</label><input id="wName" required value="${esc(x.name||'')}"></div><div class="field"><label>ประเภท</label><select id="wType"><option>เงินสด</option><option>ธนาคาร</option><option>เงินออม</option><option>อื่น ๆ</option></select></div><div class="field"><label>ยอดเงินตั้งต้น</label><input id="wBal" type="number" step="0.01" value="${esc(x.openingBalance||0)}"></div><button class="btn" style="width:100%">บันทึก</button></form>`);$('#wType').value=x.type||'เงินสด'}async function submitWallet(e,rid){e.preventDefault();try{await save('Wallets',{id:rid||id(),name:$('#wName').value,type:$('#wType').value,openingBalance:Number($('#wBal').value),active:true});closeModal()}catch(x){toast(x.message)}}
function goalForm(rid=''){let x=rows('SavingsGoals').find(x=>x.id===rid)||{};openModal('เป้าหมายการออม',`<form onsubmit="submitGoal(event,'${rid}')"><div class="field"><label>ชื่อเป้าหมาย</label><input id="gName" required value="${esc(x.name||'')}"></div><div class="formgrid"><div class="field"><label>ยอดเป้าหมาย</label><input id="gTarget" type="number" min="1" required value="${esc(x.targetAmount||'')}"></div><div class="field"><label>ยอดที่มีแล้ว</label><input id="gCurrent" type="number" min="0" value="${esc(x.currentAmount||0)}"></div></div><div class="field"><label>วันที่ต้องการ</label><input id="gDate" type="date" value="${esc(x.deadline||'')}"></div><div class="field"><label>หมายเหตุ</label><input id="gNote" value="${esc(x.note||'')}"></div><button class="btn" style="width:100%">บันทึก</button></form>`)}async function submitGoal(e,rid){e.preventDefault();try{await save('SavingsGoals',{id:rid||id(),name:$('#gName').value,targetAmount:+$('#gTarget').value,currentAmount:+$('#gCurrent').value,deadline:$('#gDate').value,note:$('#gNote').value});closeModal()}catch(x){toast(x.message)}}
function savingAction(gid){let g=rows('SavingsGoals').find(x=>x.id===gid);openModal('บันทึกการออม',`<form onsubmit="submitSaving(event,'${gid}')"><div class="field"><label>ประเภท</label><select id="sType"><option value="deposit">ออมเพิ่ม</option><option value="withdraw">ถอน</option></select></div><div class="field"><label>จำนวนเงิน</label><input id="sAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>วันที่</label><input id="sDate" type="date" value="${today()}"></div><button class="btn" style="width:100%">บันทึก</button></form><p class="small muted">ยอดปัจจุบัน ${fmt(g.currentAmount)}</p>`)}async function submitSaving(e,gid){e.preventDefault();let g=rows('SavingsGoals').find(x=>x.id===gid),amt=+$('#sAmount').value,type=$('#sType').value;if(type==='withdraw'&&amt>Number(g.currentAmount))return toast('ยอดถอนมากกว่าเงินออม');try{await save('SavingsHistory',{id:id(),goalId:gid,type,amount:amt,date:$('#sDate').value});await save('SavingsGoals',{...g,currentAmount:Number(g.currentAmount)+(type==='deposit'?amt:-amt)});closeModal()}catch(x){toast(x.message)}}
function budgetForm(rid=''){let x=rows('Budgets').find(x=>x.id===rid)||{};let cats=rows('Categories').filter(c=>c.type==='expense');openModal('ตั้งงบประมาณ',`<form onsubmit="submitBudget(event,'${rid}')"><div class="field"><label>เดือน</label><input id="bMonth" type="month" value="${esc(x.month||monthNow())}" required></div><div class="field"><label>หมวดหมู่</label><select id="bCat">${cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>วงเงิน (บาท)</label><input id="bAmount" type="number" min="1" required value="${esc(x.amount||'')}"></div><button class="btn" style="width:100%">บันทึก</button></form>`);$('#bCat').value=x.categoryId||cats[0]?.id||''}async function submitBudget(e,rid){e.preventDefault();try{await save('Budgets',{id:rid||id(),month:$('#bMonth').value,categoryId:$('#bCat').value,amount:+$('#bAmount').value});closeModal()}catch(x){toast(x.message)}}
function groupForm(){openModal('สร้างกลุ่มหารบิล',`<form onsubmit="submitGroup(event)"><div class="field"><label>ชื่อกลุ่ม</label><input id="grName" required placeholder="เช่น ทริปเชียงใหม่"></div><button class="btn" style="width:100%">สร้างกลุ่ม</button></form>`)}async function submitGroup(e){e.preventDefault();try{let g={id:id(),name:$('#grName').value};await save('BillGroups',g);closeModal();memberForm(g.id)}catch(x){toast(x.message)}}function memberForm(gid){openModal('เพิ่มเพื่อน',`<form onsubmit="submitMember(event,'${gid}')"><div class="field"><label>ชื่อเพื่อน</label><input id="mName" required></div><button class="btn" style="width:100%">เพิ่มสมาชิก</button></form>`)}async function submitMember(e,gid){e.preventDefault();try{await save('BillMembers',{id:id(),groupId:gid,name:$('#mName').value});closeModal()}catch(x){toast(x.message)}}
let billDraft=[];
function billForm(gid,bid=''){
  const mem=rows('BillMembers').filter(m=>m.groupId===gid),old=bid?rows('Bills').find(b=>b.id===bid):null;
  if(!mem.length)return toast('กรุณาเพิ่มสมาชิกในกลุ่มก่อน');
  let selected=[];try{selected=JSON.parse(old?.participantIds||'[]')}catch(e){}
  if(!selected.length)selected=mem.slice(0,2).map(m=>m.id);
  billDraft=bid?rows('BillItems').filter(x=>x.billId===bid).map(x=>({id:x.id,name:x.description,amount:Number(x.amount)||0})):[];
  openModal(bid?'แก้ไขบิล':'เพิ่มบิล',`<form onsubmit="submitBillItems(event,'${gid}','${bid}')">
  <div class="field"><label>ชื่อบิล</label><input id="billTitle" required value="${esc(old?.title||'บิลค่าใช้จ่าย')}" placeholder="เช่น ค่าอาหารวันนี้"></div>
  <div class="field"><label>วันที่</label><input id="billDate" type="date" value="${esc(old?.date||today())}" required></div>
  <div class="field"><label>จำนวนคนที่หาร</label><div class="small muted">เลือกสมาชิกที่ร่วมจ่าย ระบบจะคำนวณยอดต่อคนอัตโนมัติ</div><div class="list">${mem.map(m=>`<label class="item"><input type="checkbox" class="bill-member" value="${esc(m.id)}" ${selected.includes(m.id)?'checked':''} style="width:20px;min-height:20px">${esc(m.name)}</label>`).join('')}</div><div class="small muted" id="billPeopleCount"></div></div>
  <div class="field"><label>ใครเป็นคนจ่าย (ถ้ามี)</label><select id="billPayer"><option value="">ไม่ระบุ</option>${mem.map(m=>`<option value="${esc(m.id)}" ${old?.payerMemberId===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
  <div class="panel" style="padding:14px;margin:14px 0"><b>รายการค่าใช้จ่าย</b><div class="field"><label>ชื่อรายการ</label><input id="billItemName" placeholder="เช่น ข้าว น้ำ เสื้อผ้า"></div><div class="field"><label>จำนวนเงิน (บาท)</label><input id="billItemAmount" type="number" min="0.01" step="0.01" placeholder="เช่น 100"></div><button type="button" class="btn secondary" style="width:100%" onclick="addBillDraftItem()">＋ เพิ่มรายการ</button><div id="billDraftList" style="margin-top:12px"></div><div class="item"><b class="grow">ยอดรวมทั้งหมด</b><b id="billDraftTotal">฿0.00</b></div></div>
  <div class="field"><label>หมายเหตุ (ไม่บังคับ)</label><input id="billNote" value="${esc(old?.note||'')}"></div><button class="btn" id="billSubmitBtn" style="width:100%">บันทึกบิล</button></form>`);
  document.querySelectorAll('.bill-member').forEach(x=>x.addEventListener('change',updateBillPeopleCount));renderBillDraft();
}
function updateBillPeopleCount(){let n=document.querySelectorAll('.bill-member:checked').length;const el=$('#billPeopleCount');if(el)el.textContent=`เลือกแล้ว ${n} คน`;}
function renderBillDraft(){const el=$('#billDraftList');if(!el)return;el.innerHTML=billDraft.length?billDraft.map((x,i)=>`<div class="item"><div class="grow"><b>${i+1}. ${esc(x.name)}</b></div><b>${fmt(x.amount)}</b><button type="button" class="btn ghost" onclick="editBillDraftItem(${i})">แก้</button><button type="button" class="btn danger" onclick="removeBillDraftItem(${i})">ลบ</button></div>`).join(''):'<div class="empty" style="padding:12px">ยังไม่มีรายการ กรอกชื่อและจำนวนเงินแล้วกดเพิ่มรายการ</div>';const total=billDraft.reduce((s,x)=>s+Number(x.amount||0),0);$('#billDraftTotal').textContent=fmt(total);updateBillPeopleCount();}
function addBillDraftItem(){const name=$('#billItemName').value.trim(),amount=Number($('#billItemAmount').value);if(!name)return toast('กรุณากรอกชื่อรายการ');if(!(amount>0))return toast('กรุณากรอกจำนวนเงินให้ถูกต้อง');billDraft.push({id:id(),name,amount});$('#billItemName').value='';$('#billItemAmount').value='';renderBillDraft();}
function editBillDraftItem(i){const x=billDraft[i];const name=prompt('แก้ไขชื่อรายการ',x.name);if(name===null)return;const amount=prompt('แก้ไขจำนวนเงิน',String(x.amount));if(amount===null)return;if(!name.trim()||!(Number(amount)>0))return toast('ข้อมูลรายการไม่ถูกต้อง');billDraft[i]={...x,name:name.trim(),amount:Number(amount)};renderBillDraft();}
function removeBillDraftItem(i){if(!confirm('ลบรายการนี้ใช่หรือไม่?'))return;billDraft.splice(i,1);renderBillDraft();}
async function submitBillItems(e,gid,bid){e.preventDefault();const selected=[...document.querySelectorAll('.bill-member:checked')].map(x=>x.value);if(!selected.length)return toast('เลือกคนหารอย่างน้อย 1 คน');if(!billDraft.length)return toast('เพิ่มรายการค่าใช้จ่ายอย่างน้อย 1 รายการ');const total=Number(billDraft.reduce((s,x)=>s+Number(x.amount),0).toFixed(2)),n=selected.length,per=Number((total/n).toFixed(2));const btn=$('#billSubmitBtn');btn.disabled=true;btn.textContent='กำลังบันทึก…';try{const b={id:bid||id(),groupId:gid,title:$('#billTitle').value.trim(),date:$('#billDate').value,payerMemberId:$('#billPayer').value,total,fullTotal:total,splitTotal:total,perPerson:per,splitCount:n,participantIds:JSON.stringify(selected),billType:'pair',splitMethod:'equal',note:$('#billNote').value};await save('Bills',b);const oldItems=rows('BillItems').filter(x=>x.billId===b.id);for(const x of oldItems){const r=await api('mutate',{table:'BillItems',op:'delete',id:x.id});if(!r.ok)throw Error(r.error||'ลบรายการเดิมไม่สำเร็จ');state.data.BillItems=rows('BillItems').filter(z=>z.id!==x.id);}for(const x of billDraft){const share=Number((Number(x.amount)/n).toFixed(2));await save('BillItems',{id:x.id||id(),billId:b.id,description:x.name,amount:Number(x.amount),memberShares:JSON.stringify(selected.map(memberId=>({memberId,amount:share})))});}closeModal();toast(bid?'แก้ไขบิลแล้ว':'บันทึกบิลแล้ว');billDetails(b.id);}catch(x){toast('บันทึกไม่สำเร็จ: '+x.message);btn.disabled=false;btn.textContent='บันทึกบิล';}}
function groupDetails(gid){let g=rows('BillGroups').find(x=>x.id===gid),m=rows('BillMembers').filter(x=>x.groupId===gid);openModal(g.name,`<div class="list">${m.map(x=>`<div class="item"><div class="grow">${esc(x.name)}</div><button class="btn danger" onclick="del('BillMembers','${x.id}');closeModal()">ลบ</button></div>`).join('')}</div>`)}
function billDetails(bid){let b=rows('Bills').find(x=>x.id===bid);if(!b)return;const items=rows('BillItems').filter(x=>x.billId===bid),members=rows('BillMembers').filter(x=>x.groupId===b.groupId);let ids=[];try{ids=JSON.parse(b.participantIds||'[]')}catch(e){}const people=members.filter(m=>ids.includes(m.id)),n=Math.max(1,people.length||Number(b.splitCount)||1),total=items.reduce((s,x)=>s+Number(x.amount||0),0),per=total/n;const date=new Date((b.date||today())+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'});const rowsFull=items.map((x,i)=>`<div class="item"><div class="grow">${i+1}. ${esc(x.description)}</div><b>${fmt(x.amount)}</b></div>`).join('');const rowsSplit=items.map((x,i)=>`<div class="item"><div class="grow">${i+1}. ${esc(x.description)}</div><b>${fmt(Number(x.amount)/n)}</b></div>`).join('');openModal(b.title,`<div class="panel" style="margin:10px 0;border-top:4px solid #5145D9"><div class="small muted">${esc(date)} · ยอดเต็มก่อนหาร</div><h3 style="margin:6px 0">${esc(b.title)}</h3>${rowsFull}<div class="item"><b class="grow">รวมทั้งหมด</b><b style="color:#5145D9">${fmt(total)}</b></div></div><div class="panel" style="margin:10px 0;border-top:4px solid #10B981"><div class="small muted">${esc(date)} · หารแล้ว ${n} คน</div><h3 style="margin:6px 0">${esc(b.title)}</h3>${rowsSplit}<div class="item"><b class="grow">รวมต่อคน</b><b class="positive">${fmt(per)}</b></div><div style="background:var(--mint2);border-radius:14px;padding:16px;text-align:center;margin-top:10px"><div class="small muted">แต่ละคนจ่าย</div><div style="font-size:30px;font-weight:850;color:var(--mint)">${fmt(per)}</div><div class="small muted">ยอดเต็ม ${fmt(total)} ÷ ${n} คน</div></div></div><div class="actions"><button class="btn" onclick="billForm('${b.groupId}','${b.id}')">✏️ แก้ไขบิล</button><button class="btn danger" onclick="closeModal();del('Bills','${b.id}')">ลบบิล</button><button class="btn ghost" onclick="exportBillImage('${b.id}','normal')">ดาวน์โหลดบิลปกติ</button><button class="btn secondary" onclick="exportBillImage('${b.id}','split')">ดาวน์โหลดบิลหาร</button><button class="btn" onclick="exportBillImage('${b.id}','pair')">ดาวน์โหลดภาพคู่</button></div>`);}
function exportBillImage(bid,mode){const b=rows('Bills').find(x=>x.id===bid);if(!b)return;const items=rows('BillItems').filter(x=>x.billId===bid),all=rows('BillMembers').filter(x=>x.groupId===b.groupId);let ids=[];try{ids=JSON.parse(b.participantIds||'[]')}catch(e){}const n=Math.max(1,ids.length||Number(b.splitCount)||1),total=items.reduce((s,x)=>s+Number(x.amount||0),0),per=total/n;const W=900,pad=58,lineH=66,header=300,footer=mode==='split'?260:180,H=header+items.length*lineH+footer;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#F4F6FB';x.fillRect(0,0,W,H);function card(y,h,color){x.fillStyle='#fff';x.strokeStyle=color;x.lineWidth=5;x.beginPath();x.roundRect(24,y,W-48,h,28);x.fill();x.stroke()}function drawBill(y,kind){const green=kind==='split';const color=green?'#07966B':'#5145D9';const shownTotal=green?per:total;const h=header+items.length*lineH+footer;card(y,h,green?'#10B981':'#DDE3EF');x.textAlign='center';x.fillStyle=green?'#E4FBF1':'#EEF0FF';x.beginPath();x.roundRect(330,y+34,240,54,27);x.fill();x.fillStyle=color;x.font='bold 28px sans-serif';x.fillText(green?`หารแล้ว ÷ ${n} คน`:'ยังไม่หาร',W/2,y+70);x.fillStyle='#182235';x.font='bold 42px sans-serif';x.fillText(b.title||'บิลค่าใช้จ่าย',W/2,y+145);x.fillStyle='#718096';x.font='26px sans-serif';x.fillText(`${b.date||''}${green?' · '+n+' คน':''}`,W/2,y+194);x.strokeStyle='#D8E0EA';x.setLineDash([12,10]);x.lineWidth=4;x.beginPath();x.moveTo(pad,y+225);x.lineTo(W-pad,y+225);x.stroke();x.setLineDash([]);items.forEach((it,i)=>{const yy=y+285+i*lineH;x.textAlign='left';x.fillStyle='#263244';x.font='28px sans-serif';x.fillText(`${i+1}. ${it.description}`,pad,yy);x.textAlign='right';x.font='bold 28px sans-serif';x.fillText(fmt(green?Number(it.amount)/n:it.amount),W-pad,yy);x.strokeStyle='#E5EAF0';x.beginPath();x.moveTo(pad,yy+20);x.lineTo(W-pad,yy+20);x.stroke();});const fy=y+285+items.length*lineH;x.textAlign='left';x.fillStyle='#1D2939';x.font='bold 34px sans-serif';x.fillText(green?`รวม ÷ ${n}`:'รวมทั้งหมด',pad,fy+24);x.textAlign='right';x.fillStyle=color;x.font='bold 38px sans-serif';x.fillText(fmt(shownTotal),W-pad,fy+24);if(green){x.fillStyle='#DDF8EC';x.beginPath();x.roundRect(pad,fy+58,W-2*pad,125,24);x.fill();x.textAlign='center';x.fillStyle='#07865F';x.font='26px sans-serif';x.fillText('คนละ',W/2,fy+98);x.font='bold 52px sans-serif';x.fillText(fmt(per),W/2,fy+153);x.font='22px sans-serif';x.fillText(`ยอดเต็ม ${fmt(total)}`,W/2,fy+184);}}
if(mode==='pair'){const h=header+items.length*lineH+footer;const fullH=h*2+28;c.height=fullH;x.fillStyle='#F4F6FB';x.fillRect(0,0,W,fullH);drawBill(0,'normal');drawBill(h+28,'split');}else drawBill(0,mode);const a=document.createElement('a');a.download=`MONEY-FLOW-${mode}-${b.date||'bill'}.png`;a.href=c.toDataURL('image/png');a.click();}
function reconcileForm(){let w=rows('Wallets');if(!w.length)return toast('กรุณาสร้างกระเป๋าเงินก่อน');openModal('ตรวจสอบยอดบัญชี',`<form onsubmit="submitRecon(event)"><div class="field"><label>บัญชี</label><select id="rWallet">${w.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>ยอดเงินจริง</label><input id="rActual" type="number" step="0.01" required></div><div class="field"><label>วันที่ตรวจสอบ</label><input id="rDate" type="date" value="${today()}"></div><div class="field"><label>หมายเหตุ</label><input id="rNote"></div><button class="btn" style="width:100%">ตรวจสอบและบันทึก</button></form>`)}async function submitRecon(e){e.preventDefault();let wid=$('#rWallet').value,w=rows('Wallets').find(x=>x.id===wid),system=Number(w.openingBalance||0)+rows('Transactions').filter(x=>x.walletId===wid).reduce((a,x)=>a+(x.type==='income'?1:-1)*Number(x.amount),0),actual=+$('#rActual').value;try{await save('BankReconciliation',{id:id(),walletId:wid,date:$('#rDate').value,actualBalance:actual,systemBalance:system,difference:actual-system,note:$('#rNote').value});closeModal();toast(Math.abs(actual-system)<.005?'ยอดตรงกัน':'พบส่วนต่าง '+fmt(actual-system))}catch(x){toast(x.message)}}
function exportCSV(){let a=rows('Transactions'),header=['id','type','amount','category','wallet','date','note'];let csv=[header.join(','),...a.map(x=>[x.id,x.type,x.amount,catName(x.categoryId),walletName(x.walletId),x.date,x.note].map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','))].join('\n');download('money-flow-transactions.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function backup(){download('money-flow-backup.json',JSON.stringify(state.data,null,2),'application/json')}function download(name,content,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function changeApi(){let v=prompt('Google Apps Script Web App URL (ลงท้ายด้วย /exec)',state.api);if(v){state.api=v.trim();localStorage.setItem('mf_api',state.api);refresh()}}
async function boot(){if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});document.body.classList.toggle('dark',state.theme==='dark');let cached=localStorage.getItem('mf_cache');if(cached){try{state.cachedData=JSON.parse(cached)}catch(e){}}if(!state.api){let v=prompt('วาง Google Apps Script Web App URL (ลงท้ายด้วย /exec)');if(v){state.api=v.trim();localStorage.setItem('mf_api',state.api)}}if(state.api){try{await loadData();renderShell();return}catch(e){if(state.cachedData){state.data=state.cachedData;renderShell();toast('เชื่อมต่อไม่ได้: แสดงข้อมูลล่าสุดที่เคยซิงค์ · '+e.message);return}$('#loginStatus').textContent=e.message;toast(e.message);return}}if(state.cachedData){state.data=state.cachedData;renderShell()}else{$('#loginStatus').textContent='ยังไม่ได้ตั้งค่า Apps Script URL · เปิดแอปใหม่เพื่อวาง URL'}}boot();
</script></body></html>
